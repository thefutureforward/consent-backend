<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sitio demo (config remota)</title>

<!-- PARTE A. Stub inline. Consent Mode denegado por defecto, antes de GTM. -->
<script>
  (function () {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("consent", "default", {
      analytics_storage: "denied", ad_storage: "denied", ad_user_data: "denied",
      ad_personalization: "denied", functionality_storage: "denied",
      personalization_storage: "denied", wait_for_update: 500
    });
    try {
      var m = document.cookie.match(/(?:^|; )consent_cookie_consent=([^;]+)/);
      if (m) { var prev = JSON.parse(decodeURIComponent(m[1])); if (prev && prev.signals) gtag("consent","update",prev.signals); }
    } catch (e) {}
  })();
</script>

<!-- PARTE B. Config MINIMA: solo site_id + apiBase. El resto llega del backend. -->
<script>
  var siteId = new URLSearchParams(location.search).get("site_id") || "PON_AQUI_TU_SITE_ID";
  window.__consentConfig = { siteId: siteId, apiBase: location.origin };
</script>
<script async src="./consent-banner.js"></script>

<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F6F5F1;color:#1c2531}
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px 140px}
  h1{font-size:30px;margin:0 0 10px}
  p{line-height:1.6;color:#3a4655}
  code{background:#eceae2;padding:1px 6px;border-radius:5px;font-size:13px}
  .console{background:#14243D;color:#cfe3ff;border-radius:12px;padding:14px 16px;margin-top:22px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;max-height:280px;overflow:auto}
  .console .k{color:#7fd1c4;font-weight:700;display:inline-block;min-width:80px}
  .console .k.delete{color:#ff9d9d}.console .k.update{color:#ffd27f}.console .k.remote{color:#c7b3ff}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Sitio demo con config remota</h1>
    <p>Esta pagina no lleva colores ni textos: solo un <code>site_id</code> y el <code>apiBase</code>. El banner descarga su configuracion del backend (Fase 3). Cambia la config en el dashboard, recarga aqui, y veras el cambio sin tocar esta pagina.</p>
    <p>site_id en uso: <code id="sid"></code></p>
    <div class="console" id="console"></div>
  </div>
  <script>
    document.getElementById("sid").textContent = window.__consentConfig.siteId;
    var box=document.getElementById("console");
    window.__consentLog=function(kind,detail){
      var t=new Date().toLocaleTimeString();
      var r=document.createElement("div");
      r.innerHTML="<span class='k "+kind+"'>"+kind+"</span> "+t+"  "+detail;
      box.appendChild(r); box.scrollTop=box.scrollHeight;
    };
  </script>
</body>
</html>
