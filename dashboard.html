<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consent Banner. Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#14243D; --accent:#2E7D74; --accent-dark:#26665f;
    --cream:#f3eee1; --line:#e6e4dc; --line-soft:#f0eee8; --muted:#6b7280;
    --paper:#F7F6F2; --white:#fff; --danger:#c0392b; --ok:#2e7d32; --warn:#b45309;
    --radius:12px; --shadow:0 1px 2px rgba(20,36,61,.04), 0 4px 16px rgba(20,36,61,.05);
    /* tokens tomados del prototipo de Apariencia v2 */
    --accent-bg:#EEF5F3;   /* fondo del paso o grupo activo */
    --accent-pale:#8FD3C2; /* subrayado de la pestana activa en la barra */
    --canvas:#EDEBE4;      /* lienzo de la vista previa */
    --foot:#FCFBF8;        /* pie de tarjeta */
    --ok-bg:#E6F4EA; --ok-fg:#1E6B36; --bad-bg:#FDECEB; --bad-fg:#A5342A;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--paper);color:#1c2531;font-size:14px;line-height:1.5}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
       background:var(--line-soft);padding:1px 5px;border-radius:4px}


  /* ---------- Apariencia: asistente (portado del prototipo v2) ---------- */
  .wz{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
      display:flex;flex-direction:column;min-width:0}
  .wz-head{padding:22px 24px 18px;border-bottom:1px solid var(--line-soft);
           display:flex;flex-direction:column;gap:12px}
  .wz-h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .wz-num{font-size:12px;color:var(--muted)}
  .row.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .wz-bar{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden}
  .wz-bar > i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
  .wz-steps{display:flex;gap:6px}
  .wz-step{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;
           border-radius:8px;cursor:pointer;text-align:left;font-size:12.5px;font-weight:600;
           background:transparent;color:var(--muted)}
  .wz-step.on{background:var(--accent-bg);color:var(--ink)}
  .wz-step i{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;
             justify-content:center;font-size:10.5px;flex:0 0 auto;background:var(--line);
             color:var(--muted);font-style:normal}
  .wz-step.on i,.wz-step.done i{background:var(--accent);color:#fff}
  .wz-body{padding:22px 24px;display:flex;flex-direction:column;gap:22px}
  .wz-foot{padding:16px 24px;border-top:1px solid var(--line-soft);display:flex;
           justify-content:space-between;align-items:center;gap:12px;background:var(--foot);
           border-radius:0 0 var(--radius) var(--radius)}
  .wz-intro h2{margin:0 0 6px;font-size:16px;font-weight:700}
  .wz-intro p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
  /* Fila de confirmacion del detector: lo encontrado, en chips, y el deshacer. */
  .wz-det-ok{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
  .wz-det-n{font-size:12px;font-weight:600;color:var(--ok)}
  .wz-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
           background:var(--ok-bg);color:var(--ok-fg);font-size:12px}
  .wz-chip i{width:10px;height:10px;border-radius:2px;display:inline-block;
             border:1px solid rgba(20,36,61,.18)}
  .wz-deshacer{margin-left:auto;background:none;border:0;padding:0;cursor:pointer;
               font-size:12px;font-weight:600;color:var(--accent);text-decoration:underline}
  /* Aviso de cumplimiento dentro del asistente: ambar, como en el rediseno. */
  .wz-aviso{margin:10px 0 0;padding:10px 12px;background:#FDF4E3;border-radius:8px;
            font-size:12.5px;line-height:1.55;color:#7A5B16}
  .wz-sunken{display:flex;flex-direction:column;gap:10px;padding:14px;
             background:var(--paper);border-radius:10px}
  .wz-field{display:flex;flex-direction:column;gap:8px}
  .wz-lab{font-size:13px;font-weight:600}
  .wz-sub{font-weight:400;color:var(--muted)}
  .wz-help{font-size:12px;color:var(--muted);line-height:1.5}
  .wz-in{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
         background:var(--white);color:var(--ink);outline:none}
  .wz-in:focus{border-color:var(--accent)}
  .wz-in.mono{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .wz .row{display:flex;gap:8px;align-items:center}
  .wz-color{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);
            overflow:hidden;cursor:pointer;flex:0 0 auto;position:relative}
  .wz-color input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}
  .wz-cr{font-size:12px;padding:5px 9px;border-radius:999px;font-weight:600}
  .wz-cr.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .wz-cr.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .wz-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wz-pick{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px;
           cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
  .wz-pick.row{flex-direction:row;align-items:center;gap:10px;padding:10px}
  .wz-pick.on{border:2px solid var(--accent);padding:7px}
  .wz-pick.row.on{padding:9px}
  .wz-sw{height:34px;border-radius:5px;display:flex;align-items:center;padding:0 8px;gap:4px;
         border:1px solid rgba(20,36,61,.08)}
  .wz-sw i{flex:1;height:3px;border-radius:2px}
  .wz-sw b{width:16px;height:8px;border-radius:2px;display:block}
  .wz-corner{width:22px;height:22px;border-top:2px solid var(--ink);border-left:2px solid var(--ink);
             flex:0 0 auto}
  .wz-pick-l{font-size:12.5px;font-weight:600;color:var(--ink)}
  .wz-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .wz-todavia{font-style:normal;font-size:11px;font-weight:500;color:var(--muted)}
  .wz-sub2{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;
           border-top:1px solid var(--line-soft)}
  .wz-langs{align-self:flex-start}
  .wz-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wz-count.bad{color:var(--bad-fg);font-weight:600}
  .wz textarea.wz-in{resize:vertical;line-height:1.5}
  .wz-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .wz-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wz-pick .wz-help{font-weight:400}
  .wz-todavia{font-style:normal;font-size:10.5px;font-weight:600;color:var(--warn);
              border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}
  .wz-sub2{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;
           border-top:1px solid var(--line-soft)}
  .wz-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wz-count.bad{color:var(--danger);font-weight:600}
  .wz-langs{align-self:flex-start}
  .wz textarea.wz-in{resize:vertical;line-height:1.5}
  .wz-full{padding:16px 24px;border-top:1px solid var(--line-soft);display:flex;
           align-items:center;justify-content:space-between;gap:12px}
  .wz-full-t{display:block;font-size:13px;font-weight:600;color:var(--ink)}
  .wz-link{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
  .wz-ovbar{align-items:center}
  .wz .ctl .wz-revert{display:none;flex:0 0 auto;width:28px;height:28px;border-radius:50%;
       border:1px solid var(--line);background:var(--white);color:var(--accent);
       font-size:14px;line-height:1;cursor:pointer}
  .wz .ctl .wz-revert:hover{border-color:var(--accent)}
  .wz .ctl.wz-ov:not(.ctl-full):not(.ctl-wide){grid-template-columns:1fr 210px 28px}
  .wz .ctl.wz-ov .wz-revert{display:block}
  .wz .ctl.wz-ov input,.wz .ctl.wz-ov select{border-color:var(--ink);border-width:1.5px}
  /* filas del modo desarrollador: etiqueta y ruta a la izquierda, control a la derecha */
  .ctl-p{display:none}
  .wz .ctl:not(.ctl-full):not(.ctl-wide){display:grid;grid-template-columns:1fr 210px;align-items:center;gap:12px}
  .wz .ctl-full > .ctl-t{margin-bottom:8px}
  .wz .ctl-full > .ctl-t > label{font-size:13px}
  .wz .ctl-t{display:flex;flex-direction:column;gap:2px}
  .wz .ctl-p{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  .wz .ctl > label{font-size:13px;font-weight:600}
  .wz .ctl input,.wz .ctl select{width:100%}
  .wz-sub3{font-size:12.5px;color:var(--muted)}
  .wz-explica{margin:0 0 4px;font-size:13px;line-height:1.55;color:var(--muted)}
  .grp-n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wz .group > summary{display:flex;align-items:center;gap:8px}
  /* Cabeceras de grupo en el modo desarrollador: sin fondo ni caja, como el
     prototipo. Solo el nombre y el recuento. */
  .wz .group{border:0;border-radius:0;background:none;margin:0}
  .wz .group + .group{border-top:1px solid var(--line-soft)}
  .wz .group > summary{background:none !important;padding:16px 0 10px;font-size:14px;
                       font-weight:700;color:var(--ink)}
  .wz .group[open] > summary{background:none !important}
  .wz .group > .body,.wz .group > div{padding:0 0 14px}
  .wz .grp-n{font-size:12px;font-weight:400}
  /* Los editores con interfaz propia conservan su caja, pero sin el verde. */
  .wz .ctl-wide,.wz .ctl-full{background:none}
  .tm-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;
          padding:8px 10px;background:var(--white);border:1px solid var(--line);border-radius:10px}
  .tm-lab{font-size:12px;color:var(--muted);margin-right:4px}
  .tm{border:1px solid var(--line);background:var(--white);border-radius:7px;padding:5px 11px;
      font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}
  .tm.on{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}
  .tm i{font-style:normal;color:#E8B931;font-size:11px}
  .tm-add{border:1px dashed var(--line);background:none;border-radius:7px;padding:5px 10px;
          cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
  .tm-sp{flex:1}
  .btn.sm{padding:6px 10px;font-size:12px}
  .wz-pub{font-size:12.5px;color:var(--accent);font-weight:600;margin-right:4px}
  .wz-foot .row{gap:12px;align-items:center}
  .prev-nota{margin-left:auto;font-size:12px;color:var(--muted)}
  .prev-pie{margin:12px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
  .preview .lienzo iframe{transition:max-width .2s}
  .btn.dark{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}

  /* ---------- barra superior ---------- */
  .topbar{background:var(--ink);color:#fff;padding:8px 24px;display:flex;align-items:center;
          gap:6px 18px;min-height:56px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .site-current{display:flex;align-items:center;gap:10px}
  .pt{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:rgba(247,246,242,.35)}
  .pt.ok{background:#8FD3C2}
  .pt.sucio{background:#E8B931}
  .ver-pill{padding:3px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;
            font-family:ui-monospace,Menlo,monospace;font-size:11px;opacity:.85}
  .brand{font-weight:700;letter-spacing:.01em;font-size:15px;white-space:nowrap}
  .brand span{opacity:.5;font-weight:400;margin-left:6px}
  .topbar .spacer{flex:1}
  .topbar .who{font-size:13px;opacity:.8}
  .icon-btn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;
            border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;
            transition:background .15s,border-color .15s}
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}

  .lang-sw{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);padding:2px}
  .lang-sw button{color:rgba(255,255,255,.65);padding:5px 11px;font-size:12px}
  .lang-sw button.on{background:rgba(255,255,255,.92);color:var(--ink)}
  .site-picker{position:relative}
  .site-current{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);
                border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:6px 12px;
                cursor:pointer;color:#fff;max-width:340px;transition:background .15s}
  .site-current:hover{background:rgba(255,255,255,.14)}
  .site-current .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .site-current .id{font-size:11.5px;opacity:.6;font-family:ui-monospace,Menlo,monospace}
  .site-current .caret{opacity:.6;font-size:10px;margin-left:2px}
  .site-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:320px;background:#fff;
             border:1px solid var(--line);border-radius:var(--radius);
             box-shadow:0 12px 40px rgba(20,36,61,.18);padding:6px;z-index:30}
  .site-menu .opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
                  cursor:pointer;color:#1c2531}
  .site-menu .opt:hover{background:var(--paper)}
  .site-menu .opt.sel{background:#eef5f3}
  .site-menu .opt .info{flex:1;min-width:0}
  .site-menu .opt b{display:block;font-size:13.5px;font-weight:600}
  .site-menu .opt small{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .site-menu .sep{height:1px;background:var(--line-soft);margin:6px 4px}
  .site-menu .add{display:block;width:100%;text-align:left;background:transparent;border:0;
                  padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--accent);
                  font-weight:600;font-size:13.5px}
  .site-menu .add:hover{background:var(--paper)}
  .mini-del{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);
            border-radius:7px;width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px;padding:0}
  .mini-del:hover{border-color:var(--danger);color:var(--danger)}

  /* ---------- layout ---------- */
  .shell{max-width:none;margin:0;padding:0}
  .plano{padding:0}
  .tabbar{display:flex;gap:2px;margin-left:8px;
          overflow-x:auto;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;
                 color:rgba(247,246,242,.65);border-bottom:2px solid transparent;
                 color:var(--muted);font-weight:500;border-bottom:2px solid transparent;
                 margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
  .tabbar button:hover{color:#fff}
  .tabbar button.on{color:#F7F6F2;border-bottom-color:var(--accent-pale);font-weight:600}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
        padding:20px;box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card h2{font-size:14px;margin:0 0 4px;font-weight:600}
  .card .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }

  /* ---------- editor ---------- */
  .editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
               flex-wrap:wrap;margin-bottom:12px}
  .editor-head .left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ver-chip{background:var(--cream);border-radius:999px;padding:3px 10px;font-size:11.5px;color:#6b5f3f}
  .editor-wrap{position:relative;border:1px solid var(--line);border-radius:10px;
               overflow:hidden;background:#fbfaf7;transition:border-color .15s}
  .editor-wrap.bad{border-color:var(--danger)}
  #cfg{width:100%;border:0;background:transparent;padding:14px;resize:vertical;
       font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
       line-height:1.65;min-height:520px;white-space:pre;tab-size:2;outline:none;display:block}
  .editor-foot{margin:0 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .checks{margin:0 24px;margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.5}
  .check .ic{flex:none;width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;
             text-align:center;color:#fff;font-weight:700;margin-top:2px}
  .check.pass .ic{background:var(--ok)}
  .check.fail .ic{background:var(--danger)}
  .check.warn .ic{background:var(--warn)}

  /* ---------- botones ---------- */
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 17px;
       font-weight:600;cursor:pointer;font-size:13.5px;transition:background .15s}
  .btn:hover{background:var(--accent-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--paper);border-color:var(--ink)}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #e8c9c4}
  .btn.danger:hover{background:#fdf5f4;border-color:var(--danger)}
  .btn.sm{padding:7px 13px;font-size:12.5px}
  a.btn{text-decoration:none;display:inline-block}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.mt{margin-top:12px}

  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:500}
  .field + .field{margin-top:14px}
  input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:9px;
       padding:10px 12px;font-size:13.5px;background:#fff;transition:border-color .15s}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--accent)}
  .shell > .plano > .hint{margin:0 24px 40px}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
  .hint.ok{color:var(--ok)} .hint.err{color:var(--danger)}

  /* ---------- snippet ---------- */
  .snippet{background:var(--ink);color:#d3e6ff;border-radius:10px;padding:16px;
           font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;
           line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto}
  .steps{counter-reset:s;margin:0 0 16px;padding:0;list-style:none}
  .steps li{counter-increment:s;position:relative;padding-left:30px;font-size:13px;
            color:#404a58;margin-bottom:9px;line-height:1.55}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;
            border-radius:50%;background:var(--cream);color:#6b5f3f;font-size:11px;
            font-weight:700;text-align:center;line-height:20px}

  /* ---------- registros ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px}
  .stat .n{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .stat.acc .n{color:var(--ok)} .stat.rej .n{color:var(--danger)} .stat.cus .n{color:var(--warn)}
  .table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:520px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}

       align-items:start;padding:24px}

  .group{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}

  .group > summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13px;
                   background:var(--paper);list-style:none;display:flex;
                   align-items:center;justify-content:space-between}
  .group > summary::-webkit-details-marker{display:none}
  .group > summary::after{content:"\25BE";font-size:10px;color:var(--muted);transition:transform .15s}
  .group[open] > summary::after{transform:rotate(180deg)}
  .group .body{padding:14px}
  .ctl{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:9px}
  .ctl:last-child{margin-bottom:0}
  .ctl > label{margin:0;font-size:12px}
  .ctl input[type=text]{padding:7px 9px;font-size:12.5px}

  return fetch(API+path, {method:method, headers:{"Content-Type":"application/json"},

      return r.json().then(function(d){ return {ok:r.ok, d:d}; })

/* Claves ordenadas de mas larga a mas corta: si "Contrasena" fuese antes que
   "Contrasena nueva", la segunda quedaria traducida a medias.              */
var DICT_KEYS = Object.keys(DICT).sort(function(a, b){ return b.length - a.length; });

var LANG = "en";   // hasta que idiomaInicial() decida

function frase(t){
  if(LANG === "es" || !t) return t;
  var limpio = t.trim();
  if(DICT[limpio]) return t.replace(limpio, DICT[limpio]);   // conserva espacios
  // Solo frases largas. Una clave de dos letras aplicada por subcadena entra
  // dentro de las palabras: "El" convertia documentElement en documentThement.
  var out = t;
  for(var i = 0; i < DICT_KEYS.length; i++){
    var k = DICT_KEYS[i];
    if(k.length < 12) continue;
    if(out.indexOf(k) !== -1) out = out.split(k).join(DICT[k]);
  }
  return out;
}

/* Un unico punto de intercepcion: cualquier innerHTML que se asigne en esta
   pagina pasa por el traductor. Envolver las 25 llamadas a mano era fragil
   (una expresion regular con comillas dentro basto para romper el parseo) y
   ademas habria que acordarse de envolver cada pintado nuevo.
   El editor JSON y los campos de texto usan .value, no innerHTML, asi que la
   configuracion del cliente no pasa por aqui y no hay riesgo de traducirla.  */
(function(){
  var d = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
  if(!d || !d.set) return;
  Object.defineProperty(Element.prototype, "innerHTML", {
    configurable: true,
    get: function(){ return d.get.call(this); },
    set: function(v){ d.set.call(this, tr(v)); }
  });
})();

function tr(h){
  if(LANG === "es" || typeof h !== "string") return h;

  // El codigo para copiar y pegar NUNCA se traduce. Un reemplazo dentro de
  // "document.documentElement" o de un nombre de clase deja al cliente con un
  // snippet roto, y eso no se ve hasta que falla en su sitio.
  var guardados = [];
  h = h.replace(/<(div class="snippet"|code|textarea)([\s\S]*?)<\/(div|code|textarea)>/g,
    function(m){ guardados.push(m); return "\u0000" + (guardados.length - 1) + "\u0000"; });

  h = h.replace(/>([^<>]+)</g, function(m, txt){ return ">" + frase(txt) + "<"; });
  h = h.replace(/placeholder="([^"]*)"/g, function(m, t){ return 'placeholder="' + frase(t) + '"'; });
  h = h.replace(/\u0000(\d+)\u0000/g, function(m, i){ return guardados[Number(i)]; });
  return h;
}

/* El idioma del navegador manda la primera vez; despues, lo que el usuario
   haya elegido a mano. Se guarda por navegador, no en el servidor: es una
   preferencia de quien mira, no del sitio.                                  */
function idiomaInicial(){
  try{
    var g = localStorage.getItem("dash_lang");
    if(g === "es" || g === "en") return g;
  }catch(e){}
  var n = [];
  try{ n = navigator.languages && navigator.languages.length
            ? navigator.languages : [navigator.language || ""]; }catch(e){}
  for(var i = 0; i < n.length; i++){
    var b = String(n[i]).toLowerCase().split("-")[0];
    if(b === "es") return "es";
    if(b === "en") return "en";
  }
  // Ingles por defecto: solo se llega aqui si el navegador no pide ni espanol
  // ni ingles (un aleman, por ejemplo), o si no se pudo leer la lista. El
  // ingles es la apuesta mas segura para alguien de fuera.
  return "en";
}

var _estaticoES = null;
function setLang(l){
  if(l !== "es" && l !== "en") return;
  LANG = l;
  try{ localStorage.setItem("dash_lang", l); }catch(e){}
  document.documentElement.setAttribute("lang", l);
  aplicarEstatico();
  if(el("app") && !el("app").classList.contains("hide")){
    renderTabs(); openTab(tab);
  }
}

/* El login y la barra superior son HTML fijo, no pasan por ningun render.
   Guardamos el original en espanol para poder traducir y volver.           */
function aplicarEstatico(){
  if(_estaticoES === null){
    _estaticoES = { login: el("login").innerHTML, top: el("topbar").innerHTML };
  }
  el("login").innerHTML  = _estaticoES.login;
  el("topbar").innerHTML = _estaticoES.top;
  pintarSelectorIdioma();
  if(window._usuario && el("who")) el("who").textContent = window._usuario;
  if(typeof sites !== "undefined" && sites && sites.length) renderPicker();
}

function pintarSelectorIdioma(){
  var host = el("lang-sw"); if(!host) return;
  host.innerHTML =
    '<button class="'+(LANG==="es"?"on":"")+'" onclick="setLang(\'es\')">ES</button>'+
    '<button class="'+(LANG==="en"?"on":"")+'" onclick="setLang(\'en\')">EN</button>';
}

function val(id){ var e=el(id); return e?e.value:""; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function msg(id,t,err){var e=el(id); if(!e)return; e.textContent=frase(t); e.className="msg "+(err?"err":"ok");}
function show(which){
  el("login").classList.toggle("hide", which!=="login");
  el("app").classList.toggle("hide", which!=="app");
}
function fecha(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  var p = function(n){ return n<10 ? "0"+n : ""+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+
         " "+p(d.getHours())+":"+p(d.getMinutes());
}

function login(){
  j("POST","/dash/login",{username:val("u"),password:val("p")}).then(function(r){
    if(r.ok){ boot(); } else { msg("lmsg", r.d.error||"No se pudo entrar.", true); }
  });
}
function logout(){ j("POST","/dash/logout").then(function(){ location.reload(); }); }

/* Alta de cuenta. El formulario es publico, pero la cuenta nace pendiente:
   sin la aprobacion de un super, el login responde 403. */
function modoAlta(si){
  el("login").querySelector(".card").classList.toggle("hide", si);
  el("alta-card").classList.toggle("hide", !si);
  msg("lmsg",""); msg("rmsg","");
}
function registrar(){
  var u = val("ru"), p = val("rp"), p2 = val("rp2");
  if(p !== p2) return msg("rmsg","Las dos contrasenas no coinciden.", true);
  j("POST","/dash/register",{username:u, password:p}).then(function(r){
    if(!r.ok) return msg("rmsg", r.d.error||"No se pudo enviar la solicitud.", true);
    el("alta-card").innerHTML =
      '<h1>Solicitud enviada</h1>'+
      '<p class="sub">Tu cuenta queda a la espera de que un super administrador la apruebe. '+
      'Cuando lo haga, podras entrar con el usuario y la contrasena que acabas de elegir.</p>'+
      '<div class="row mt"><button class="btn ghost" style="flex:1" onclick="location.reload()">Volver</button></div>';
  });
}

function boot(){
  LANG = idiomaInicial();
  document.documentElement.setAttribute("lang", LANG);
  aplicarEstatico();
  j("GET","/dash/me").then(function(r){
    if(!r.ok){ show("login"); return; }
    show("app");
    window._usuario = r.d.username;
    esAdmin = (r.d.role === "admin" || r.d.role === "super");
    esSuper = (r.d.role === "super");
    el("who").textContent = r.d.username;
    sites = r.d.sites || [];
    var existe = sites.filter(function(s){ return s.site_id===current; }).length;
    if(!current || !existe){ current = sites.length ? sites[0].site_id : null; }
    renderPicker();
    renderTabs();
    openTab(tab);
  });
}

/* ---------------- selector de sitio ---------------- */
function renderPicker(){
  var p = el("picker");
  if(!sites.length){
    p.innerHTML = '<button class="icon-btn" onclick="modalNuevoSitio()">+ Crear primer sitio</button>';
    return;
  }
  var cur = sites.filter(function(s){return s.site_id===current;})[0] || sites[0];
  p.innerHTML =
    '<div class="site-current" onclick="toggleMenu(event)">'+
      '<span class="pt" id="pt-estado"></span>'+
      '<div style="min-width:0">'+
        '<div class="nm">'+esc(cur.name)+'</div>'+
        '<div class="id" id="sitio-estado">'+esc(cur.site_id)+'</div>'+
      '</div><span class="caret">&#9660;</span>'+
    '</div>'+
    (menuOpen ? renderMenu() : '');
}
function renderMenu(){
  return '<div class="site-menu" onclick="event.stopPropagation()">'+
    sites.map(function(s){
      var safe = esc(s.name).replace(/'/g,"");
      return '<div class="opt'+(s.site_id===current?' sel':'')+'" onclick="pickSite(\''+s.site_id+'\')">'+
        '<div class="info"><b>'+esc(s.name)+'</b><small>'+esc(s.site_id)+'</small></div>'+
        (esSuper ? '<button class="mini-del" title="Borrar sitio" onclick="event.stopPropagation();modalBorrarSitio(\''+
          s.site_id+'\',\''+safe+'\')">&times;</button>' : '')+
      '</div>';
    }).join('')+
    '<div class="sep"></div>'+
    '<button class="add" onclick="modalNuevoSitio()">+ Nuevo sitio</button>'+
  '</div>';
}
function toggleMenu(e){ if(e) e.stopPropagation(); menuOpen = !menuOpen; renderPicker(); }
document.addEventListener("click", function(){ if(menuOpen){ menuOpen=false; renderPicker(); } });
function pickSite(id){
  current = id; menuOpen = false;
  window._ckDetectadas = undefined;   // son de otro sitio: hay que volver a pedirlas
  renderPicker(); openTab(tab);
}

function renderTabs(){
  var lista = TABS.filter(function(t){ return (!t.admin || esAdmin) && (!t.super || esSuper); });
  el("tabbar").innerHTML = lista.map(function(t){
    return '<button class="'+(t.id===tab?'on':'')+'" onclick="openTab(\''+t.id+'\')">'+t.label+'</button>';
  }).join('');

function openTab(id){
  tab = id; renderTabs();
  if(id==="cuenta") return viewCuenta();
  if(id==="usuarios") return viewUsuarios();
  if(!current){
    el("tabbody").innerHTML = '<div class="card"><div class="empty">Crea un sitio para empezar.</div></div>';
    return;
  }
  j("GET","/dash/site/get?site_id="+encodeURIComponent(current)).then(function(r){
    if(!r.ok){
      el("tabbody").innerHTML = '<div class="card"><div class="empty">No se pudo cargar el sitio.</div></div>';
      return;
    }
    window._cfgActual = r.d.config || {};
    if(id==="config")    viewConfig(r.d);
    if(id==="instalar")  viewInstalar(r.d);
    if(id==="registros") viewRegistros(r.d);
    if(id==="cookies")   viewCookies(r.d);
  });
}

/* lectura y escritura por ruta "a.b.c" */
function getPath(o, path){
  var parts = path.split("."), v = o;
  for(var i=0;i<parts.length;i++){
    if(v==null || typeof v!=="object") return undefined;
    v = v[parts[i]];
  }
  return v;
}
function setPath(o, path, value){
  var parts = path.split("."), cur = o;
  for(var i=0;i<parts.length-1;i++){
    if(typeof cur[parts[i]]!=="object" || cur[parts[i]]===null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  var last = parts[parts.length-1];
  // Cadena vacia = "quitalo y usa el valor por defecto del bundle".
  if(value==="" || value===undefined) delete cur[last];
  else cur[last] = value;
}

// Quita una clave y, si el objeto que la contenia se queda vacio, lo quita
// tambien. Asi la config no se llena de {"texts":{"en":{}}} cada vez que
// alguien escribe y borra en un campo.
function borrarPath(o, path){
  var parts = path.split("."), pila = [], cur = o, i;
  for(i=0;i<parts.length-1;i++){
    if(cur[parts[i]] == null || typeof cur[parts[i]] !== "object") return;
    pila.push([cur, parts[i]]); cur = cur[parts[i]];
  }
  delete cur[parts[parts.length-1]];
  for(i=pila.length-1;i>=0;i--){
    var padre = pila[i][0], clave = pila[i][1];
    if(Object.keys(padre[clave]).length === 0) delete padre[clave]; else break;
  }
}


/* ===================== APARIENCIA: ASISTENTE =====================
   Portado del prototipo "Consent Admin - Appearance v2". Alli corre sobre
   una plantilla propia (sc-if / sc-for); aqui se reescribe en el mismo
   estilo del resto del dashboard: funciones que devuelven HTML.

   La idea del prototipo: el cliente toma cuatro decisiones de marca y de
   ahi se derivan el resto de propiedades (hover, bordes, anillo de foco,
   velo). Lo derivado se escribe en la config igual que si se hubiera
   puesto a mano, asi que el bundle no necesita saber nada de esto.        */

var WIZ = { paso: 1, modo: "guided", devTab: "props" };
var WIZ_NPROPS = 0;   // lo cuenta el render
var _datosSitio = null;

/* ---- dominios del sitio ----------------------------------------------
   Se guardan en una sola columna separados por coma, porque asi los lee
   origen_permitido en el backend. Pero todo lo que necesita UNO solo (abrir
   el sitio, detectar el estilo, el fondo de la previsualizacion) tiene que
   elegir cual: antes se usaba la cadena entera como si fuera una URL y con
   dos dominios quedaba "https://cliente.com, www.cliente.com".          */
function domLista(s){
  if(s === undefined) s = (_datosSitio || {}).domain || "";
  return String(s || "").split(",").map(function(x){ return x.trim(); })
    .filter(function(x){ return !!x; });
}
var DOM_ACTIVO = "";   // el que han elegido los selectores; "" = el primero
function domActivo(){
  var L = domLista();
  if(!L.length) return "";
  return (DOM_ACTIVO && L.indexOf(DOM_ACTIVO) >= 0) ? DOM_ACTIVO : L[0];
}
function domUrl(d){
  d = d || domActivo();
  return d ? (/^https?:/i.test(d) ? d : "https://" + d) : "";
}
/* Un unico sitio activo para los tres sitios donde se usa, para que elegir en
   uno no deje a los otros apuntando a otra parte. */
function setDomActivo(v){
  DOM_ACTIVO = v || "";
  var u = el("wz-url");
  if(u) u.value = domActivo();
  var n = el("prev-nota");
  if(n && PREV_FONDO === "site") n.textContent = "Vista en vivo · " + domActivo();
  document.querySelectorAll("select.dom-sel").forEach(function(s){ s.value = domActivo(); });
  if(PREV_FONDO === "site") refrescarPreview();
}
/* Con un solo dominio el selector no aporta nada y solo quita sitio. */
function domSelect(extra){
  var L = domLista();
  if(L.length < 2) return "";
  var act = domActivo();
  return '<select class="dom-sel'+(extra ? " " + extra : "")+'" '+
    'onchange="setDomActivo(this.value)" title="Dominio a usar">'+
    L.map(function(d){
      return '<option value="'+esc(d)+'"'+(d===act?' selected':'')+'>'+esc(d)+'</option>';
    }).join("")+'</select>';
}

/* ---- color: luminancia, contraste y mezcla ---------------------------
   Mismas formulas que el prototipo (WCAG 2.x). Sirven para elegir texto
   legible sobre un fondo y para derivar el hover sin pedirlo.            */
function wHex(h){
  h = String(h||"").replace("#","");
  if(h.length === 3) h = h.split("").map(function(c){ return c+c; }).join("");
  var n = parseInt(h,16) || 0;
  return [n>>16 & 255, n>>8 & 255, n & 255];
}
function wToHex(r){
  return "#" + r.map(function(v){
    return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0");
  }).join("").toUpperCase();
}
function wLum(h){
  var c = wHex(h).map(function(v){
    v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4);
  });
  return .2126*c[0] + .7152*c[1] + .0722*c[2];
}
function wContraste(a,b){
  var l1 = wLum(a), l2 = wLum(b);
  return (Math.max(l1,l2) + .05) / (Math.min(l1,l2) + .05);
}
function wMezcla(a,b,t){
  var A = wHex(a), B = wHex(b);
  return wToHex(A.map(function(v,i){ return v + (B[i]-v)*t; }));
}
/* Texto legible sobre un fondo: el que mas contraste da. */
function wSobre(bg){
  return wContraste(bg,"#FFFFFF") >= wContraste(bg,"#14243D") ? "#FFFFFF" : "#14243D";
}

/* ---- tipografias que ofrece el asistente ---- */
/* La tipografia que encuentra el detector se suma al desplegable como "la de
   tu sitio": asi pasa por el mismo camino que las demas y el asistente no la
   pisa al recalcular. */

var WIZ_FUENTES = [
  ["plex",   "Instrument Sans · Google Fonts", "'Instrument Sans', sans-serif", true],
  ["work",   "Work Sans · Google Fonts",       "'Work Sans', sans-serif",       true],
  ["dm",     "DM Sans · Google Fonts",         "'DM Sans', sans-serif",         true],
  ["serif",  "Source Serif 4 · Google Fonts",  "'Source Serif 4', Georgia, serif", true],
  ["system", "System font · no download",      "system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif", false]

/* ---- lectura y escritura de la config ---- */
function wCfg(){ try{ return JSON.parse(el("cfg").value); }catch(e){ return null; } }
function wGuardar(o){
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg(); pintaEstado(); renderVisual(); refrescarPreview();
}
function wMarca(o){
  // Las cuatro decisiones se guardan aparte, en "brand". Si se dedujeran de
  // colors.accent, sobrescribir ese campo cambiaria la propia decision y
  // entonces nada podria marcarse como puesto a mano.
  if(o.brand && o.brand.fuente) return o.brand;
  var c = o.colors || {}, f = o.fonts || {}, bn = o.banner || {};
  var fam = f.body || "";
  var id = "plex";
  var LF = wListaFuentes();
  for(var i=0;i<LF.length;i++){ if(LF[i][2] === fam) id = LF[i][0]; }
  var radio = String((o.buttons && o.buttons.radius) || "");
  return {
    fuente: id,
    color: c.accent || "#2F7E6C",
    fondo: bn.background ? (String(bn.background).toUpperCase() === "#FFFFFF" ? "light" : "brand") : "dark",
    esquinas: radio === "0" || radio === "0px" ? "rectas" : (parseInt(radio,10) >= 16 ? "redondeadas" : "suaves")
  };
}

/* ---- derivacion: de cuatro decisiones a las propiedades ----
   Solo se escriben claves que el bundle ya entiende. */
/* Calcula que valores saldrian de las cuatro decisiones de Brand, sin
   escribirlos. Sirve para dos cosas: aplicarlos, y saber en el modo
   desarrollador que campos el cliente ha puesto a mano. */
function wDerivar(m){
  /* La familia detectada se resuelve desde la propia decision, no desde la
     lista: asi no depende de que la opcion "site" siga construida en memoria. */
  var fuente = (m.fuente === "site" && m.fuenteFam)
    ? ["site", "La de tu sitio", m.fuenteFam, false]
    : (wListaFuentes().filter(function(f){ return f[0] === m.fuente; })[0] || WIZ_FUENTES[0]);
  var color  = /^#[0-9a-fA-F]{6}$/.test(m.color) ? m.color.toUpperCase() : "#2F7E6C";
  var rad    = { rectas:[0,0,0,0], suaves:[6,6,10,4], redondeadas:[999,16,20,999] }[m.esquinas];
  var oscuro = m.fondo === "dark", marca = m.fondo === "brand";
  var bnBg   = oscuro ? "#16233B" : marca ? color : "#FFFFFF";
  var bnFg   = marca ? wSobre(color) : oscuro ? "#F5F0E6" : "#14243D";
  var acepBg = marca ? bnFg : color;
  var acepFg = marca ? color : wSobre(color);
  var acentoClaro = wContraste(color,"#FFFFFF") >= 4.5 ? color : wMezcla(color,"#14243D",.4);
  var d = {};
  d["fonts.body"] = fuente[2];
  d["fonts.heading"] = fuente[2];
  d["webfont"] = !!fuente[3];
  d["colors.accent"] = acentoClaro;
  d["colors.accentHover"] = wMezcla(acepBg,"#000000",.15);
  d["colors.ink"] = bnBg;
  d["colors.text"] = bnFg;
  d["colors.accentPale"] = bnFg;
  d["banner.background"] = bnBg;
  d["banner.color"] = bnFg;
  d["banner.radius"] = (m.esquinas === "rectas" ? "0" : rad[1] + "px");
  d["buttons.radius"] = rad[0] + "px";
  d["buttons.accept.background"] = acepBg;
  d["buttons.accept.color"] = acepFg;
  d["buttons.save.background"] = acentoClaro;
  d["buttons.save.color"] = wSobre(acentoClaro);
  d["panel.radius"] = rad[2] + "px";
  d["switchStyle.radius"] = rad[3] + "px";
  d["switchStyle.on"] = acentoClaro;
  d["switchStyle.off"] = "#FFFFFF";
  d["switchStyle.border"] = "1px solid " + acentoClaro;
  d["switchStyle.onBorder"] = acentoClaro;
  // El panel se queda sobre fondo claro aunque el banner sea oscuro: es una
  // superficie de lectura, no una franja de marca.
  d["panel.background"] = "#FFFFFF";
  d["panel.overlay"] = wMezcla(bnBg === "#FFFFFF" ? "#14243D" : bnBg, "#000000", .35) + "8C";
  d["colors.panelBg"] = "#FFFFFF";
  d["colors.border"] = wMezcla(acentoClaro, "#FFFFFF", .72);
  // Y la pestana de reapertura, que hasta ahora no derivaba nada y se quedaba
  // con los colores de fabrica, desentonando en cuanto la marca no era verde.
  d["chip.background"] = acepBg;
  d["chip.color"] = acepFg;
  d["chip.radius"] = rad[0] + "px";
  d["chip.border"] = "0";
  d["chip.shadow"] = (m.esquinas === "rectas" ? "none" : "0 2px 6px rgba(22,35,59,.10)");
  return d;
}

function wAplicarMarca(cambio){
  var o = wCfg(); if(!o) return;
  var m = wMarca(o); for(var k in cambio) m[k] = cambio[k];
  o.brand = m;                       // la decision, aparte de sus consecuencias
  var d = wDerivar(m);
  for(var ruta in d) setPath(o, ruta, d[ruta]);
  wGuardar(o);
}

function wizardHTML(o){

  return '<div class="wz">'+

function wListaFuentes(){
  var f = WIZ_FUENTE_SITIO;
  /* Al recargar la pagina esta variable se pierde, pero la familia quedo
     guardada en brand. Sin rehidratarla, "site" no estaria en la lista y
     wDerivar caeria al primer preset: el siguiente cambio de color o de
     esquinas pisaba la tipografia detectada con Instrument Sans. */
  if(!f){
    var o = wCfg(), b = (o && o.brand) || null;
    if(b && b.fuente === "site" && b.fuenteFam)
      f = WIZ_FUENTE_SITIO = { fam: b.fuenteFam, nombre: b.fuenteNombre || wNombreFam(b.fuenteFam) };
  }
  if(!f) return WIZ_FUENTES;
  return [["site", "La de tu sitio \u00b7 " + f.nombre, f.fam, false]].concat(WIZ_FUENTES);
}

// Primera familia de una pila CSS, sin comillas: "'Soehne', Arial" -> Soehne
function wNombreFam(fam){
  return String(fam || "").split(",")[0].replace(/['"]/g, "").trim();
}

  var reabrir =

        ['<button class="wz-pick'+(reab==="tab"?" on":"")+'" onclick="wSetReab(\'tab\')">'+

  grupos.chip = reabrir +

      ? '<div class="wz-field"><label class="wz-lab">Esquina</label>'+
          tarjetas([["bottom-left","Abajo izq."],["bottom-right","Abajo der."],
                    ["top-left","Arriba izq."],["top-right","Arriba der."]], esq, "wSetEsq", 2)+'</div>'+
        '<div class="wz-field"><label class="wz-lab">Contenido</label>'+
          tarjetas([["both","Icono y texto"],["icon","Solo icono"],["text","Solo texto"]], cont, "wSetCont")+'</div>'
      : '<p class="wz-aviso">Ahora mismo la reapertura va por el enlace del pie, asi que la '+

  grupos.enlace = reabrir +
    (reab==="footer"
      ? '<div class="wz-field"><label class="wz-lab">Que abre el enlace</label>'+

      : '<p class="wz-aviso">Ahora mismo la reapertura va por la pestana de la esquina. Cambia el '+

/* ---- Modo desarrollador ------------------------------------------------
   El asistente cubre las decisiones de marca; aqui esta todo lo demas, que
   es con lo que se configura un sitio de verdad: categorias, bloqueo de
   scripts, cookies que se borran, textos, y las propiedades sueltas.

   La aportacion del rediseño es saber que viene derivado de Brand y que se
   ha puesto a mano: lo segundo se marca y se puede devolver al valor
   derivado, uno a uno o todos de golpe. */

/* Rutas que no son "propiedades" sino contenido: no tienen valor derivado y
   no se marcan. */
function wEsContenido(ruta){
  return ruta === "categories" || ruta === "autoBlock" || ruta === "cookiePatterns" ||
         ruta.indexOf("texts.") === 0 || ruta === "customCss";
}

/* Una propiedad esta "puesta a mano" en dos casos: difiere de lo que derivaria
   el modo guiado, o tiene valor propio cuando el bundle ya traia uno de serie.
   En el segundo caso revertir significa vaciarla, no escribir nada. */
function wSobrescritas(o){
  var d = wDerivar(wMarca(o)), fuera = [];
  UI_GROUPS.forEach(function(g){
    g.items.forEach(function(it){
      var ruta = it.p;
      if(wEsContenido(ruta)) return;
      var actual = getPath(o, ruta);
      if(actual === undefined || actual === null || actual === "") return;
      if(d[ruta] !== undefined){
        if(String(actual).toUpperCase() !== String(d[ruta]).toUpperCase()) fuera.push(ruta);
      } else {
        fuera.push(ruta);
      }
    });
  });
  return fuera;
}

function devHTML(o){
  var ov = wSobrescritas(o);
  if(!WIZ_NPROPS) WIZ_NPROPS = UI_GROUPS.reduce(function(n,g){ return n + g.items.length; }, 0);
  var props = WIZ.devTab !== "json";
  return '<div class="wz">'+
    '<div class="wz-head">'+
      '<div class="row between">'+
        '<div><h1 class="wz-h1">Editor de desarrollador</h1>'+
          '<span class="wz-sub3">'+WIZ_NPROPS+' <span>propiedades</span> &middot; '+
             ov.length+' <span>sobrescritas</span></span></div>'+
        '<button class="btn ghost sm" onclick="wModo(\'guided\')">&larr; Modo guiado</button>'+
      '</div>'+
      '<div class="modes wz-langs">'+
        '<button class="'+(props?'on':'')+'" onclick="wDevTab(\'props\')">Propiedades</button>'+
        '<button class="'+(props?'':'on')+'" onclick="wDevTab(\'json\')">JSON</button>'+
      '</div>'+

    '</div>'+
    '<div class="wz-body">'+
      (props ? '<p class="wz-explica">Cada valor sale del modo guiado. Escribe para sobrescribirlo; '+
                 '&#8634; lo devuelve al valor derivado.'+
               '</p><div id="wz-grupos"></div>'
             : '<div class="wz-help" style="margin-bottom:8px">La configuracion completa. '+
               'Los cambios se validan al escribir.</div>'+
               '<div id="wz-json-host"></div>')+
    '</div>'+
    wPie('<button class="btn ghost" onclick="wResetTodo()"'+(ov.length?'':' disabled')+
         '>Devolver todo a lo derivado</button>')+
  '</div>';
}

/* Marca en el DOM los campos derivados y los sobrescritos. Se hace despues
   de pintar porque los grupos los genera el render de siempre. */
/* Numero de campos por grupo, a la derecha del titulo, como en el prototipo. */
function wContarGrupos(){
  var host = el("wz-grupos"); if(!host) return;
  host.querySelectorAll("details.group").forEach(function(d){
    var sum = d.querySelector("summary"); if(!sum) return;
    var n = d.querySelectorAll(".ctl[data-p]").length; if(!n) return;
    var ov = d.querySelectorAll(".ctl.wz-ov").length;
    var sp = sum.querySelector(".grp-n");
    if(!sp){ sp = document.createElement("span"); sp.className = "grp-n"; sum.appendChild(sp); }
    // "8 · 1 overridden": el numero solo no dice donde hay algo a mano.
    sp.innerHTML = n + (ov ? ' &middot; ' + ov + ' <span>sobrescritas</span>' : '');
  });
}

function wMarcarCampos(o){
  var d = wDerivar(wMarca(o)), fuera = wSobrescritas(o);
  var host = el("wz-grupos"); if(!host) return;
  var rutas = {};
  for(var k in d) rutas[k] = 1;
  fuera.forEach(function(r){ rutas[r] = 1; });
  for(var ruta in rutas){
    var nodo = host.querySelector('.ctl[data-p="'+ruta+'"]');
    if(!nodo || nodo.classList.contains("ctl-full")) continue;
    var puesto = fuera.indexOf(ruta) >= 0;
    nodo.classList.add("wz-deriv");
    nodo.classList.toggle("wz-ov", puesto);
    // Si el campo esta puesto a mano, abrimos su grupo: de poco sirve marcarlo
    // dentro de un desplegable cerrado.
    if(puesto){
      var det = nodo.closest("details");
      if(det) det.open = true;
    }
    if(!nodo.querySelector(".wz-revert")){
      var b = document.createElement("button");
      b.className = "wz-revert"; b.innerHTML = "&#8634;";
      b.setAttribute("aria-label", "volver a lo derivado");
      b.title = d[ruta] !== undefined ? ("Valor derivado: " + d[ruta]) : "Volver al valor de serie";
      b.onclick = (function(r){ return function(){ wRevertir(r); }; })(ruta);
      nodo.appendChild(b);
    }
  }
}

function wRevertir(ruta){
  var o = wCfg(); if(!o) return;
  var d = wDerivar(wMarca(o));
  if(d[ruta] !== undefined) setPath(o, ruta, d[ruta]);
  else borrarPath(o, ruta);          // sin derivada: vuelve al valor de serie
  wGuardar(o);
}
function wResetTodo(){

/* ===================== TEMAS =====================
   Un tema es un parche sobre la configuracion base: solo lleva lo que cambia.
   El asistente y el editor de desarrollador trabajan sobre la VISTA (base +
   parche), pero al guardar se vuelve a reducir al parche, para que un tema no
   acabe con las 147 propiedades dentro. */

var TEMA_EDIT = "";   // "" = la base; si no, el nombre del tema que se edita

function temaBase(){ try{ return JSON.parse(el("cfg").value); }catch(e){ return null; } }

function temaFusion(base, parche){
  var o = JSON.parse(JSON.stringify(base));
  (function mezcla(d, s){
    for(var k in s){
      if(!s.hasOwnProperty(k)) continue;
      if(s[k] && typeof s[k] === "object" && !Array.isArray(s[k]) &&
         d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) mezcla(d[k], s[k]);
      else d[k] = s[k];
    }
  })(o, parche || {});
  return o;
}

/* Lo que ven los renders: base, o base + parche si se esta editando un tema. */
function objVista(){
  var b = temaBase(); if(!b) return null;
  if(!TEMA_EDIT || !b.themes || !b.themes[TEMA_EDIT]) return b;
  return temaFusion(b, b.themes[TEMA_EDIT]);
}

/* Reduce la vista al parche: solo las hojas que difieren de la base. */
function temaDiff(base, vista){
  function rec(b, v){
    var out = {}, hay = false;
    for(var k in v){
      if(!v.hasOwnProperty(k)) continue;
      if(k === "themes" || k === "theme" || k === "_temaActivo") continue;
      var bv = b ? b[k] : undefined, vv = v[k];
      if(vv && typeof vv === "object" && !Array.isArray(vv)){
        var sub = rec(bv && typeof bv === "object" ? bv : {}, vv);
        if(sub !== null){ out[k] = sub; hay = true; }
      } else if(JSON.stringify(bv) !== JSON.stringify(vv)){
        out[k] = vv; hay = true;
      }
    }
    return hay ? out : null;
  }
  return rec(base, vista) || {};
}

/* Guarda una vista modificada en el sitio correcto. */
function temaGuardarVista(vista){
  var b = temaBase(); if(!b) return;
  if(!TEMA_EDIT){ el("cfg").value = JSON.stringify(vista, null, 2); }
  else {
    b.themes = b.themes || {};
    b.themes[TEMA_EDIT] = temaDiff(b, vista);
    el("cfg").value = JSON.stringify(b, null, 2);
  }
  validarCfg(); pintaEstado(); renderVisual(); refrescarPreview();
}

/* ---- barra de temas ---- */
function temasHTML(o){
  var t = o.themes || {}, nombres = Object.keys(t);
  var activo = o.theme || "";
  var chips = [['', 'Base']].concat(nombres.map(function(n){ return [n, n]; })).map(function(x){
    var on = TEMA_EDIT === x[0];
    var esActivo = x[0] && x[0] === activo;
    return '<button class="tm'+(on?' on':'')+'" onclick="temaEditar(\''+x[0]+'\')">'+
      esc(x[1]) + (esActivo ? '<i title="El que ven los visitantes">&#9733;</i>' : '') +
    '</button>';
  }).join("");
  var puedeMas = TEMA_EDIT !== "";
  return '<div class="tm-bar">'+
    '<span class="tm-lab">Apariencias</span>'+ chips +
    '<button class="tm-add" onclick="temaNuevo()" title="Duplicar la actual">+</button>'+
    '<span class="tm-sp"></span>'+
    (puedeMas ?
      '<button class="btn ghost sm" onclick="temaActivar()"'+(TEMA_EDIT===activo?' disabled':'')+
        '>Usar esta</button>'+
      '<button class="btn ghost sm" onclick="temaBorrar()">Borrar</button>' : '')+
    domSelect() +
    '<button class="btn ghost sm" onclick="temaProbar()">Probar en mi sitio</button>'+

}

function temaEditar(n){ TEMA_EDIT = n; renderVisual(); refrescarPreview(); }

function temaNuevo(){
  var b = temaBase(); if(!b) return;
  var n = prompt("Nombre de la apariencia nueva (sin espacios):", "");
  if(!n) return;
  n = String(n).trim().toLowerCase().replace(/\s+/g, "-");
  if(!n) return;
  b.themes = b.themes || {};
  if(b.themes[n]){ alert("Ya existe una apariencia con ese nombre."); return; }
  // Nace como copia de la que se esta viendo: cambiar dos colores es mas
  // comodo que partir de cero.
  b.themes[n] = TEMA_EDIT && b.themes[TEMA_EDIT]
    ? JSON.parse(JSON.stringify(b.themes[TEMA_EDIT])) : {};
  el("cfg").value = JSON.stringify(b, null, 2);
  TEMA_EDIT = n;
  validarCfg(); pintaEstado(); renderVisual(); refrescarPreview();
}

function temaActivar(){
  var b = temaBase(); if(!b || !TEMA_EDIT) return;
  b.theme = TEMA_EDIT;
  el("cfg").value = JSON.stringify(b, null, 2);
  validarCfg(); renderVisual();
}

function temaBorrar(){
  var b = temaBase(); if(!b || !TEMA_EDIT) return;
  if(!confirm('Borrar la apariencia "'+TEMA_EDIT+'"?')) return;
  delete b.themes[TEMA_EDIT];
  if(b.theme === TEMA_EDIT) b.theme = "";
  el("cfg").value = JSON.stringify(b, null, 2);
  TEMA_EDIT = "";
  validarCfg(); pintaEstado(); renderVisual(); refrescarPreview();
}

/* ---- Resaltado cruzado -------------------------------------------------
   Al enfocar un campo o pasar por un grupo, la vista previa salta al
   componente que toca y lo rodea con un borde discontinuo. Las reglas de que
   va con que son las del prototipo. */
var HL_ACTUAL = null;

/* Se reintenta: si acabamos de cambiar de pestaña, el iframe se esta
   rehaciendo y el mensaje llegaria antes de que el banner exista. */
function hlEnviar(que, intentos){
  var fr = el("prev");
  if(!fr || !fr.contentWindow) return;
  try{ fr.contentWindow.postMessage({tipo:"cb-resalta", que:que || null}, "*"); }catch(e){}
  if(!que) return;
  var n = intentos === undefined ? 12 : intentos;
  if(n <= 0) return;
  clearTimeout(hlEnviar._t);
  hlEnviar._t = setTimeout(function(){
    if(HL_ACTUAL === que) hlEnviar(que, n - 1);
  }, 150);
}

/* Cambia de pestaña solo si hace falta: rehacer el iframe en cada hover
   seria lento y ademas perderia el resaltado. */
function hlPestana(p){
  if(p && prevEstado !== p) setPreview(p);
}

function hlPorCampo(clave){
  var p = clave.indexOf("panel") === 0 ? "panel" : (clave === "chip" ? "chip" : "banner");
  var q = clave === "accept" ? "accept" : (clave === "chip" ? "chip" : "banner");
  if(p === "panel") q = "panel";
  hlPestana(p);
  HL_ACTUAL = q;
  hlEnviar(q);
}

function hlPorGrupo(titulo){
  var t = String(titulo || "");
  var p = /Panel|panel/.test(t) ? "panel" : (/Pill|pestana|chip/i.test(t) ? "chip" : "banner");
  var q = /Panel|panel/.test(t) ? "panel"
        : (/Pill|pestana|chip/i.test(t) ? "chip"
        : (/Botones|Buttons/i.test(t) ? "accept" : "banner"));
  hlPestana(p);
  HL_ACTUAL = q;
  hlEnviar(q);
}

function hlFuera(){ HL_ACTUAL = null; clearTimeout(hlEnviar._t); hlEnviar(null, 0); }

/* ---- Detector ----------------------------------------------------------
   Pide al servidor que lea la portada del cliente y aplica lo que encuentre
   a las cuatro decisiones de marca. Lo que no se pueda deducir se deja como
   esta, en vez de inventarlo. */
function wDetectar(){
  var inp = el("wz-url"), btn = el("wz-det"), m = el("wz-det-msg");
  if(!inp) return;
  var url = inp.value.trim();
  if(!url){ if(m) m.textContent = "Escribe la direccion de tu sitio."; return; }
  if(btn){ btn.disabled = true; btn.textContent = "Leyendo..."; }
  if(m) m.textContent = "Leyendo " + url + "...";
  j("GET", "/dash/site/detect?url=" + encodeURIComponent(url)).then(function(r){
    if(btn){ btn.disabled = false; btn.textContent = "Detectar de nuevo"; }
    if(!r.ok || r.d.error){
      if(m) m.textContent = r.d.error || "No se pudo leer el sitio.";
      return;
    }
    var d = r.d, cambio = {}, dicho = [], chips = [];
    // La marca de antes, para poder volver. Se guarda ANTES de tocar nada.
    var _o = wCfg();
    WIZ_DET_PREVIA = _o ? wFoto(_o) : null;
    if(d.fontFamily){
      // Se guarda como opcion del desplegable; es suya, no se descarga nada.
      var corto = wNombreFam(d.fontFamily);
      WIZ_FUENTE_SITIO = { fam: d.fontFamily, nombre: corto };
      // La familia viaja dentro de brand para sobrevivir a una recarga.
      cambio.fuente = "site";
      cambio.fuenteFam = d.fontFamily;
      cambio.fuenteNombre = corto;
      dicho.push("tipografia"); chips.push([corto, null]);
    }
    if(d.accent){ cambio.color = d.accent; dicho.push("color"); chips.push([d.accent, d.accent]); }
    if(d.surface){ cambio.fondo = d.surface === "dark" ? "dark" : "light"; dicho.push("fondo");
      chips.push([d.surface === "dark" ? "Fondo oscuro" : "Fondo claro", null]); }
    if(d.radius){ cambio.esquinas = d.radius; dicho.push("esquinas");
      chips.push([{rectas:"Esquinas rectas",suaves:"Esquinas suaves",redondeadas:"Esquinas redondeadas"}[d.radius] || d.radius, null]); }
    if(!dicho.length){
      WIZ_DET_CHIPS = null; WIZ_DET_PREVIA = null;
      WIZ_DET_MSG = "No se pudo deducir nada de ese sitio.";
      renderVisual(); return;
    }
    WIZ_DET_CHIPS = chips;
    WIZ_DET_MSG = "Revisa y ajusta lo que no encaje.";
    // El deshacer caduca: dejarlo para siempre haria que un \"Deshacer\" de hace
    // media hora revirtiera ajustes hechos despues a mano.
    if(WIZ_DET_TIMER) clearTimeout(WIZ_DET_TIMER);
    WIZ_DET_TIMER = setTimeout(function(){
      WIZ_DET_PREVIA = null;
      if(WIZ.modo !== "dev" && WIZ.paso === 1) renderVisual();
    }, 20000);
    wAplicarMarca(cambio);
  });
}

/* Foto de lo que el detector va a pisar: la marca, y el valor anterior de
   cada propiedad derivada. Hace falta guardar tambien las que NO existian
   (como undefined), porque restaurar la marca de antes y volver a derivar no
   es lo mismo: una propiedad que nunca se habia derivado volveria con un
   valor, no vacia, y el pill cambiaria de aspecto al deshacer. */
function wFoto(o){
  var m = JSON.parse(JSON.stringify(wMarca(o)));
  var antes = {}, d = wDerivar(m);
  for(var ruta in d) antes[ruta] = getPath(o, ruta);
  return { marca: m, antes: antes };
}

function wDetDeshacer(){
  if(!WIZ_DET_PREVIA) return;
  var o = wCfg(); if(!o) return;
  var foto = WIZ_DET_PREVIA;
  WIZ_DET_PREVIA = null; WIZ_DET_CHIPS = null;
  WIZ_DET_MSG = "Deshecho. La apariencia vuelve a como estaba.";
  if(WIZ_DET_TIMER){ clearTimeout(WIZ_DET_TIMER); WIZ_DET_TIMER = null; }
  o.brand = foto.marca;
  // borrarPath para las que no existian, y asi no dejar {"chip":{}} detras;
  // setPath para las que si tenian valor.
  for(var ruta in foto.antes){
    if(foto.antes[ruta] === undefined) borrarPath(o, ruta);
    else setPath(o, ruta, foto.antes[ruta]);
  }
  wGuardar(o);
}
