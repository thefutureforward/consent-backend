        '<label class="cat-lock"><input type="checkbox"'+(c.locked?" checked":"")+
          ' onchange="catSet('+i+',\'locked\',this.checked)" /> bloqueada</label>'+
        (nUsos ? '<span class="pat-ok">'+nUsos+' regla(s)</span>' : '')+
        '<button class="btn ghost sm" onclick="catQuitar('+i+')"'+
          (c.locked?' disabled title="La bloqueada no se puede quitar"':'')+'>&times;</button>'+
      '</div>'+
      '<div class="ab-row">'+
        '<input type="text" value="'+esc(lab.es||"")+'" placeholder="Nombre (es)" '+
          'oninput="catSetTxt('+i+',\'label\',\'es\',this.value)" />'+
        '<input type="text" value="'+esc(lab.en||"")+'" placeholder="Name (en)" '+
          'oninput="catSetTxt('+i+',\'label\',\'en\',this.value)" />'+
      '</div>'+
      '<div class="ab-row">'+
        '<input type="text" value="'+esc(des.es||"")+'" placeholder="Descripcion (es)" '+
          'oninput="catSetTxt('+i+',\'desc\',\'es\',this.value)" />'+
        '<input type="text" value="'+esc(des.en||"")+'" placeholder="Description (en)" '+
          'oninput="catSetTxt('+i+',\'desc\',\'en\',this.value)" />'+
      '</div>'+
    '</div>';
  }).join('');
  var sinBloq = !lista.some(function(c){ return c.locked; });
  return '<div class="ctl ctl-wide">'+
    '<p class="sub" style="margin:0 0 10px">Cada categoria es una fila del panel. '+
      'El <code>id</code> es el que usan el bloqueo de scripts y las cookies que se borran: '+
      'si lo cambias, actualiza tambien esas dos listas.</p>'+
    (filas || '<span class="ck-desc">Sin categorias.</span>')+
    '<div class="row mt"><button class="btn ghost sm" onclick="catAnadir()">Anadir categoria</button></div>'+
    (sinBloq ? '<p class="hint">Ninguna categoria esta bloqueada. Conviene que las esenciales lo esten.</p>' : '')+
  '</div>';
}

function catLista(){
  var o = objActual(); if(!o) return null;
  if(!Array.isArray(o.categories)) o.categories = [];
  return o;
}
function catGuardar(o){
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg(); renderVisual();
}
function catSet(i, campo, valor){
  var o = catLista(); if(!o || !o.categories[i]) return;
  o.categories[i][campo] = valor;
  catGuardar(o);
}
function catSetTxt(i, campo, idioma, valor){
  var o = catLista(); if(!o || !o.categories[i]) return;
  var c = o.categories[i];
  if(typeof c[campo] === "string") c[campo] = {es:c[campo], en:c[campo]};
  if(!c[campo] || typeof c[campo] !== "object") c[campo] = {};
  c[campo][idioma] = valor;
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg();
}
function catSetId(i, valor){
  var o = catLista(); if(!o || !o.categories[i]) return;
  var viejo = o.categories[i].id;
  if(viejo === valor) return;
  var usos = 0;
  (o.autoBlock||[]).forEach(function(r){ if(r && r.category===viejo) usos++; });
  (o.cookiePatterns||[]).forEach(function(r){ if(r && r.category===viejo) usos++; });
  if(usos && !confirm("El id \""+viejo+"\" lo usan "+usos+" regla(s). Se actualizaran tambien. Continuar?")){
    renderVisual(); return;
  }
  (o.autoBlock||[]).forEach(function(r){ if(r && r.category===viejo) r.category = valor; });
  (o.cookiePatterns||[]).forEach(function(r){ if(r && r.category===viejo) r.category = valor; });
  o.categories[i].id = valor;
  catGuardar(o);
}
function catAnadir(){
  var o = catLista(); if(!o) return;
  o.categories.push({id:"", label:{es:"",en:""}, desc:{es:"",en:""}});
  catGuardar(o);
}
function catQuitar(i){
  var o = catLista(); if(!o || !o.categories[i]) return;
  var c = o.categories[i];
  if(c.locked){ alert("La categoria bloqueada no se puede quitar."); return; }
  var usos = 0;
  (o.autoBlock||[]).forEach(function(r){ if(r && r.category===c.id) usos++; });
  (o.cookiePatterns||[]).forEach(function(r){ if(r && r.category===c.id) usos++; });
  var aviso = usos ? "Quedaran "+usos+" regla(s) apuntando a \""+c.id+"\". " : "";
  if(!confirm(aviso+"Quitar la categoria?")) return;
  o.categories.splice(i,1);
  catGuardar(o);
}

function patronesUI(lista){
  var cats = catsDelSitio();
  var det = window._ckDetectadas;          // undefined mientras cargan
  var nombres = (det || []).map(function(x){ return x.name; });

  // Un patron esta "en uso" si alguna cookie detectada aqui empieza por el.
  // Los que no, suelen venir heredados de la plantilla de otro cliente.
  function usado(match){
    if(!match) return false;
    return nombres.some(function(n){ return n.indexOf(match) === 0; });
  }

  var huerfanos = 0;
  var filas = lista.map(function(r, i){
    var esTexto = (typeof r === "string");
    var match = esTexto ? r : (r.match || "");
    var cat = esTexto ? "" : (r.category || "");
    var opts = cats.map(function(c){
      return '<option value="'+esc(c)+'"'+(cat===c?" selected":"")+'>'+esc(c)+'</option>';
    }).join('');
    var mala = cats.length && cat && cats.indexOf(cat) === -1;
    var vivo = usado(match);
    if(det && !vivo) huerfanos++;
    var marca = !det ? ""
      : (vivo ? '<span class="pat-ok">detectada</span>'
              : '<span class="pat-no">no detectada aqui</span>');
    return '<div class="ab-row'+((!cat||mala)?" ab-mala":"")+'">'+
      '<input type="text" value="'+esc(match)+'" placeholder="_ga" '+
        'oninput="cpSet('+i+',\'match\',this.value)" />'+
      marca+
      '<select onchange="cpSet('+i+',\'category\',this.value)">'+
        '<option value="">sin categoria</option>'+opts+
        (mala ? '<option value="'+esc(cat)+'" selected>'+esc(cat)+' (no existe)</option>' : '')+
      '</select>'+
      '<button class="btn ghost sm" onclick="cpQuitar('+i+')">&times;</button>'+
    '</div>';
  }).join('');

  var sinCat = lista.filter(function(r){
    return (typeof r === "string") || !r.category;
  }).length;

  // Clasificadas como NO esenciales que todavia no tienen patron que las cubra.
  var faltan = (det || []).filter(function(x){
    if(!x.category || x.category === "esencial") return false;
    return !lista.some(function(r){
      var m = (typeof r === "string") ? r : r.match;
      return m && x.name.indexOf(m) === 0;
    });
  });

  return '<div class="ctl ctl-wide">'+
    '<p class="sub" style="margin:0 0 10px">Estas cookies se borran cuando el visitante '+
      'deniega su categoria. Se comparan por el principio del nombre, asi que '+
      '<code>_ga</code> alcanza tambien a <code>_ga_ABC123</code>.</p>'+
    '<div class="ab-list">'+ (filas || '<span class="ck-desc">Sin patrones.</span>') +'</div>'+
    '<div class="row mt">'+
      '<button class="btn ghost sm" onclick="cpAnadir()">Anadir patron</button>'+
      (faltan.length ? ' <button class="btn ghost sm" onclick="cpTraer()">Traer '+faltan.length+
        ' clasificada(s)</button>' : '')+
      (huerfanos ? ' <button class="btn ghost sm" onclick="cpLimpiar()">Quitar '+huerfanos+
        ' no detectada(s)</button>' : '')+
    '</div>'+
    (sinCat ? '<p class="hint">'+sinCat+' patron(es) sin categoria: solo se borran si se '+
      'deniega la analitica. Ponles la suya o clasificalas en Cookies detectadas.</p>' : '')+
    (huerfanos ? '<p class="hint">'+huerfanos+' patron(es) no se han visto nunca en este sitio. '+
      'Suelen venir de la plantilla de otro cliente. Sirven de red por si aparecen, '+
      'pero puedes quitarlos.</p>' : '')+
  '</div>';
}

/* Trae a la lista las cookies ya clasificadas como no esenciales que aun no
   tienen patron. Es lo mismo que hace el volcado al guardar la clasificacion,
   pero aqui y sin salir de la pantalla. */
function cpTraer(){
  var o = cpLista(); if(!o) return;
  (window._ckDetectadas || []).forEach(function(x){
    if(!x.category || x.category === "esencial") return;
    var cubierta = o.cookiePatterns.some(function(r){
      return r.match && x.name.indexOf(r.match) === 0;
    });
    if(!cubierta) o.cookiePatterns.push({match:x.name, category:x.category});
  });
  abGuardar(o);
}

/* Quita los patrones que nunca se han visto aqui. */
function cpLimpiar(){
  var o = cpLista(); if(!o) return;
  var nombres = (window._ckDetectadas || []).map(function(x){ return x.name; });
  o.cookiePatterns = o.cookiePatterns.filter(function(r){
    return r.match && nombres.some(function(n){ return n.indexOf(r.match) === 0; });
  });
  abGuardar(o);
}

function cpLista(){
  var o = objActual(); if(!o) return null;
  if(!Array.isArray(o.cookiePatterns)) o.cookiePatterns = [];
  // Al tocar cualquier fila migramos toda la lista al formato nuevo: mezclar
  // cadenas y objetos complica cada lectura posterior.
  o.cookiePatterns = o.cookiePatterns.map(function(r){
    return (typeof r === "string") ? {match:r} : r;
  });
  return o;
}

function cpSet(i, campo, valor){
  var o = cpLista(); if(!o || !o.cookiePatterns[i]) return;
  if(campo === "category" && !valor) delete o.cookiePatterns[i].category;
  else o.cookiePatterns[i][campo] = valor;
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg();
}

function cpAnadir(){
  var o = cpLista(); if(!o) return;
  o.cookiePatterns.push({match:"", category: catsDelSitio()[0] || ""});
  abGuardar(o);
}

function cpQuitar(i){
  var o = cpLista(); if(!o) return;
  o.cookiePatterns.splice(i,1);
  abGuardar(o);
}

function bloqueoUI(reglas){
  var cats = catsDelSitio();
  var filas = reglas.map(function(r, i){
    var opts = cats.map(function(c){
      return '<option value="'+esc(c)+'"'+(r.category===c?" selected":"")+'>'+esc(c)+'</option>';
    }).join('');
    var mala = cats.length && cats.indexOf(r.category) === -1;
    return '<div class="ab-row'+(mala?" ab-mala":"")+'">'+
      '<input type="text" value="'+esc(r.match||"")+'" placeholder="js.ejemplo.com" '+
        'oninput="abSet('+i+',\'match\',this.value)" />'+
      '<select onchange="abSet('+i+',\'category\',this.value)">'+
        '<option value="">sin categoria</option>'+opts+
        (mala ? '<option value="'+esc(r.category)+'" selected>'+esc(r.category)+' (no existe)</option>' : '')+
      '</select>'+
      '<button class="btn ghost sm" onclick="abQuitar('+i+')" title="Quitar">&times;</button>'+
    '</div>';
  }).join('');

  // Los servicios se parten en dos: los que este sitio carga de verdad, segun
  // las cookies detectadas y ya clasificadas como NO esenciales, y el resto.
  // Sugerir doce servicios genericos a un sitio que solo usa dos es ruido.
  var det = serviciosDetectados();
  function boton(i){
    var sv = CATALOGO_BLOQUEO[i];
    var puesto = sv.d.every(function(dom){
      return reglas.some(function(r){ return r.match === dom; });
    });
    var por = det.porQue[sv.n];
    return '<button class="btn ghost sm'+(puesto?" ab-ya":"")+'" onclick="abAnadirServicio('+i+')"'+
      (puesto?" disabled":"")+(por?' title="Detectado por: '+esc(por)+'"':"")+'>'+
      (puesto?"&#10003; ":"+ ")+esc(sv.n)+'</button>';
  }

  var bloqueSug = "";
  if(det.hay.length){
    bloqueSug =
      '<p class="sub" style="margin:14px 0 6px">Detectados en este sitio</p>'+
      '<div class="ab-sug">'+ det.hay.map(boton).join('') +'</div>';
    if(det.resto.length){
      bloqueSug += '<details class="ab-otros"><summary>Otros servicios</summary>'+
        '<div class="ab-sug" style="margin-top:8px">'+ det.resto.map(boton).join('') +'</div></details>';
    }
  } else {
    bloqueSug =
      '<p class="sub" style="margin:14px 0 6px">Servicios habituales</p>'+
      '<p class="ck-desc" style="display:block;margin:0 0 8px">'+ det.motivo +'</p>'+
      '<div class="ab-sug">'+ det.resto.map(boton).join('') +'</div>';
  }
  var sugeridos = bloqueSug;

  return '<div class="ctl ctl-wide">'+
    '<p class="sub" style="margin:0 0 10px">Los scripts de estos dominios no se ejecutan hasta '+
      'que el visitante acepta su categoria. La cookie no llega a crearse.</p>'+
    '<div class="ab-list">'+ (filas || '<span class="ck-desc">Sin reglas: no se bloquea nada.</span>') +'</div>'+
    '<div class="row mt"><button class="btn ghost sm" onclick="abAnadir()">Anadir dominio</button></div>'+
    sugeridos +
    '<p class="hint" style="margin-top:12px">Recuerda copiar de nuevo el codigo de la pestana '+
      '<b>Instalar</b>: el pre-bloqueador vive en el HTML del sitio y hay que actualizarlo alli.</p>'+
  '</div>';
}

// Categorias que el visitante puede denegar. Bloquear bajo una categoria
// bloqueada no tendria sentido: nunca se deniega, luego nunca se liberaria...
// al reves, se liberaria siempre.
/* Cruza las cookies detectadas con el catalogo de servicios. Solo cuentan
   las clasificadas y NO esenciales: una cookie esencial nunca se deniega, asi
   que bloquear su script seria bloquearlo para siempre.                    */
function serviciosDetectados(){
  var rows = window._ckDetectadas;
  if(rows === null || rows === undefined)
    return {hay:[], resto:todosLosIndices(), porQue:{},
            motivo:"Cargando las cookies detectadas..."};
  var utiles = rows.filter(function(x){ return x.category && x.category !== "esencial"; });
  if(!utiles.length)
    return {hay:[], resto:todosLosIndices(), porQue:{},
            motivo:"Aun no hay cookies detectadas y clasificadas en este sitio. "+
                   "Clasificalas en la pestana Cookies detectadas y aqui apareceran "+
                   "solo los servicios que use."};

  var hay = [], resto = [], porQue = {};
  CATALOGO_BLOQUEO.forEach(function(sv, i){
    var casan = utiles.filter(function(x){
      return (sv.ck || []).some(function(pre){ return x.name.indexOf(pre) === 0; });
    }).map(function(x){ return x.name; });
    if(casan.length){ hay.push(i); porQue[sv.n] = casan.join(", "); }
    else resto.push(i);
  });
  return {hay:hay, resto:resto, porQue:porQue, motivo:""};
}

function todosLosIndices(){
  return CATALOGO_BLOQUEO.map(function(_, i){ return i; });
}

/* Se piden una vez por sitio. Si fallan, seguimos con el catalogo completo:
   el editor tiene que funcionar aunque la deteccion no haya corrido nunca. */
function cargarDetectadas(){
  if(window._ckDetectadas !== undefined) return;
  window._ckDetectadas = null;
  j("GET","/dash/site/cookies?site_id="+encodeURIComponent(current)).then(function(r){
    window._ckDetectadas = (r.ok && r.d.rows) ? r.d.rows : [];
    if(el("cfg") && cfgMode === "visual") renderVisual();
  });
}

function catsDelSitio(){
  var o = objActual();
  return ((o && o.categories) || []).filter(function(c){ return !c.locked; })
                                    .map(function(c){ return c.id; });
}

function objActual(){
  try { return JSON.parse(el("cfg").value); } catch(e){ return null; }
}

function abLista(){
  var o = objActual(); if(!o) return null;
  if(!Array.isArray(o.autoBlock)) o.autoBlock = [];
  return o;
}

function abGuardar(o){
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg();
  renderVisual();
}

function abSet(i, campo, valor){
  var o = abLista(); if(!o || !o.autoBlock[i]) return;
  o.autoBlock[i][campo] = valor;
  // Aqui no repintamos: reescribir la fila mientras se teclea perderia el foco.
  el("cfg").value = JSON.stringify(o, null, 2);
  validarCfg();
}

function abAnadir(){
  var o = abLista(); if(!o) return;
  var cats = catsDelSitio();
  o.autoBlock.push({match:"", category: cats[0] || ""});
  abGuardar(o);
}

function abQuitar(i){
  var o = abLista(); if(!o) return;
  o.autoBlock.splice(i,1);
  abGuardar(o);
}

function abAnadirServicio(i){
  var s = CATALOGO_BLOQUEO[i], o = abLista(); if(!s || !o) return;
  var cats = catsDelSitio();
  // Si el sitio no tiene la categoria que sugiere el catalogo, usamos la
  // primera disponible antes que dejar una referencia rota.
  var cat = cats.indexOf(s.cat) !== -1 ? s.cat : (cats[0] || "");
  s.d.forEach(function(dom){
    if(!o.autoBlock.some(function(r){ return r.match === dom; }))
      o.autoBlock.push({match:dom, category:cat});
  });
  abGuardar(o);
}

function control(obj, it){
  var v = getPath(obj, it.p);
  var id = "c_"+it.p.replace(/\./g,"_");
  var body = "";
  if(it.k==="color"){
    var hex = /^#[0-9a-fA-F]{6}$/.test(v||"") ? v : "#ffffff";
    body = '<div class="colorbox">'+
      '<input type="color" value="'+hex+'" oninput="onCtl(\''+it.p+'\',this.value,\''+id+'\')" />'+
      '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="por defecto" '+
        'oninput="onCtl(\''+it.p+'\',this.value)" /></div>';
  } else if(it.k==="select"){
    body = '<select id="'+id+'" onchange="onCtl(\''+it.p+'\',this.value)">'+
      '<option value="">por defecto</option>'+
      it.opts.map(function(o){
        return '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';
      }).join('')+'</select>';
  } else if(it.k==="bool"){
    // El valor por defecto de cada opcion lo dice el propio control (it.def):
    // dar por hecho "activo" mostraria encendido algo que el bundle tiene apagado.
    var marcado = (v === undefined || v === null) ? (it.def !== false) : (v !== false);
    body = '<label class="chk"><input type="checkbox" id="'+id+'"'+(marcado?' checked':'')+
      ' onchange="onCtl(\''+it.p+'\', this.checked?true:false)" /> activo</label>';
  } else if(it.k==="num"){
    // Numeros como numeros: guardarlos como texto rompe las comparaciones del bundle.
    body = '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(it.ph||"")+'" '+
      'oninput="onCtl(\''+it.p+'\', this.value===\'\' ? \'\' : Number(this.value))" />';
  } else if(it.k==="css"){
    return '<div class="ctl ctl-wide">'+
      '<p class="sub" style="margin:0 0 8px">Para lo que no tiene ajuste. Se aplica solo '+
        'dentro del banner: no puede afectar al resto del sitio. Va despues de todo, '+
        'asi que gana sin necesidad de <code>!important</code>.</p>'+
      '<textarea id="'+id+'" class="css-box" spellcheck="false" rows="10" '+
        'placeholder=".cb-accept{ letter-spacing:.04em }" '+
        'oninput="onCtl(\''+it.p+'\',this.value)">'+esc(v==null?"":v)+'</textarea>'+
      '<p class="hint">Selectores utiles: <code>.cb-inner</code> banner, '+
        '<code>.cb-panel</code> panel, <code>.cb-row</code> fila de categoria, '+
        '<code>.cb-sw</code> interruptor, <code>.cb-accept</code> <code>.cb-ghost</code> '+
        '<code>.cb-save</code> botones, <code>.cb-chip</code> pill.</p>'+
    '</div>';
  } else if(it.k==="cats"){
    return catsUI(Array.isArray(v) ? v : []);
  } else if(it.k==="patrones"){
    return patronesUI(Array.isArray(v) ? v : []);
  } else if(it.k==="bloqueo"){
    return bloqueoUI(Array.isArray(v) ? v : []);
  } else if(it.k==="area"){
    body = '<textarea id="'+id+'" rows="3" placeholder="'+esc(it.ph||"por defecto")+'" '+
      'oninput="onCtl(\''+it.p+'\',this.value)">'+esc(v==null?"":v)+'</textarea>';
  } else {
    body = '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(it.ph||"por defecto")+'" '+
      'oninput="onCtl(\''+it.p+'\',this.value)" />';
  }
  // data-p permite marcar despues que campos vienen derivados de Brand y
  // cuales se han puesto a mano (modo desarrollador).
  // Los editores con interfaz propia (categorias, patrones, bloqueo) ocupan
  // el ancho entero: la rejilla de dos columnas los aplastaria.
  var completo = (it.k === "cats" || it.k === "patrones" || it.k === "bloqueo");
  return '<div class="ctl'+(completo ? ' ctl-full' : '')+'" data-p="'+it.p+'">'+
         '<span class="ctl-t"><label>'+esc(it.l)+'</label>'+
         '<span class="ctl-p">'+esc(it.p)+'</span></span>'+ body +'</div>';
}

var _prevTimer = null;
function onCtl(path, value, mirrorId){
  var obj = objVista();
  if(!obj) return;
  // Un campo vacio significa "usa el texto de serie", no "pon cadena vacia".
  // Si guardaramos "" el banner mostraria un hueco en vez del texto por defecto.
  if(value === "" || value === null){ borrarPath(obj, path); }
  else { setPath(obj, path, value); }
  if(TEMA_EDIT){
    // Editando una apariencia: el cambio va al parche, no a la base.
    var b = temaBase();
    b.themes = b.themes || {};
    b.themes[TEMA_EDIT] = temaDiff(b, obj);
    el("cfg").value = JSON.stringify(b, null, 2);
  } else {
    el("cfg").value = JSON.stringify(obj, null, 2);
  }
  if(mirrorId){ var m = el(mirrorId); if(m) m.value = value; }   // color -> campo de texto
  validarCfg();
  pintaEstado();
  wRefrescarDev();                                  // marcas de "puesto a mano"
  clearTimeout(_prevTimer);
  _prevTimer = setTimeout(refrescarPreview, 400);   // el iframe se rehace, no en cada tecla
}

/* La vista previa monta el bundle real dentro de un iframe con la config
   que hay en el editor, sin guardar nada. */
var prevEstado = "banner";   // banner | panel | chip

var PREV_DISP = "desktop";
/* Escritorio o movil: el lienzo se estrecha a 390px, que es el ancho que usa
   el prototipo para movil. El iframe se rehace para que el banner recalcule
   sus media queries. */
function setPrevDisp(d){
  if(PREV_DISP === d) return;
  PREV_DISP = d;
  var f = el("prev");
  if(f) f.style.maxWidth = d === "mobile" ? "390px" : "";
  if(f) f.style.margin = d === "mobile" ? "0 auto" : "";
  var a = el("pd-desktop"), b = el("pd-mobile");
  if(a) a.className = d === "desktop" ? "on" : "";
  if(b) b.className = d === "mobile" ? "on" : "";
  refrescarPreview();
}

var _repintando = false;
function setPreview(modo){
  var cambio = (prevEstado !== modo);
  prevEstado = modo;
  ["banner","panel","chip","enlace"].forEach(function(m){
    var b = el("pv-"+m); if(b) b.className = (m===modo ? "on" : "");
  });
  // El panel es mas alto que el banner: con el lienzo corto salia recortado y
  // con barra de desplazamiento, que no es como se ve en el sitio.
  var f = el("prev"); if(f) f.classList.toggle("alto", modo === "panel");
  // El paso 2 depende del componente elegido, asi que hay que repintarlo. La
  // guarda es necesaria porque renderVisual acaba llamando a setPreview para
  // dejar marcado el tab: sin ella, las dos se llaman en bucle.
  if(_repintando){ refrescarPreview(); return; }
  if(WIZ.modo !== "dev" && WIZ.paso === 2 && cambio){
    _repintando = true;
    try { renderVisual(); } finally { _repintando = false; }
  } else refrescarPreview();
}

/* La previa monta el bundle real con la config del editor, sin guardar nada.
   El estado decide que se ve: el banner de entrada, el panel de preferencias
   o el pill, que en el sitio real solo aparece DESPUES de decidir. */
// Idioma que se fuerza en la previa. No cambia la config: solo deja ver como
// queda el banner en cada idioma sin tener que cambiar el navegador.
var prevLang = "es";
function setPrevLang(l){ prevLang = l; marcarLang(); refrescarPreview(); }
function marcarLang(){
  ["es","en"].forEach(function(l){
    var b = el("pl-"+l); if(b) b.className = (l===prevLang ? "on" : "");
  });
}

/* Pie de ejemplo con las dos formas del disparador. Se inyecta en la propia
   previa para verlas sobre la pagina, no en una caja aparte.               */
function bloqueEnlace(cfg){
  if(prevEstado !== "enlace") return "";
  var T = cfg.trigger || {};
  var lg = prevLang === "en" ? "en" : "es";
  var txt = textoTrigger(T, lg), estilo = estiloTrigger(T), hash = T.hash || "cookies";
  return '<div style="margin-top:28px;border-top:1px solid #e6e2da;padding-top:18px">'+
    '<button type="button" data-consent-open style="'+estilo+'">'+txt+'</button>'+
    '<p style="margin:14px 0 0">'+ frase("Consulta nuestra") +
      ' <a href="#'+hash+'">'+txt+'</a> '+ frase("cuando quieras.") +'</p>'+
  '</div>';
}

function refrescarPreview(){
  var fr = el("prev"); if(!fr) return;
  var cfg = objVista();
  if(!cfg) return;
  cfg = JSON.parse(JSON.stringify(cfg));
  // La vista previa ya trae el tema fusionado; sin esto el bundle lo
  // aplicaria otra vez y mandaria el activo, no el que se esta editando.
  delete cfg.themes; delete cfg.theme;
  // Sin siteId ni apiBase el bundle no pide la config remota ni registra nada.
  delete cfg.endpoint; delete cfg.siteId; delete cfg.apiBase; delete cfg.publicKey;
  cfg.consentVersion = "preview-" + Date.now();   // sin decision previa: se muestra el banner
  cfg.activeDeletion = false;                     // la previa no toca cookies
  cfg.cookieDiscovery = false;                    // ni reporta nada
  // La previa manda sobre la deteccion: queremos ver el idioma elegido en la
  // barra, no el del navegador de quien mira el dashboard.
  cfg.autoDetectLanguage = false;
  cfg.defaultLanguage = prevLang;

  // Guion que lleva al banner hasta el estado pedido, en cuanto esta montado.
  var guion = "";
  if(prevEstado === "panel"){
    guion = "esperar(function(sr){ var b=sr.querySelector(\"[data-a='manage']\"); if(b){b.click();return true;} });";
  } else if(prevEstado === "enlace"){
    // Aceptamos primero: el enlace de reapertura solo tiene sentido cuando el
    // visitante ya decidio. Asi la previa reproduce el momento real.
    guion = "esperar(function(sr){ var b=sr.querySelector(\"[data-a='accept']\"); if(b){b.click();return true;} });";
  } else if(prevEstado === "chip"){
    // Aceptar cierra el banner y saca el pill, que es como se ve en el sitio.

    aviso = "<p style='color:#b45309'>" + frase("El pill esta desactivado en la configuracion, "+
            "por eso no aparece nada.") + "</p>";

  // Pagina neutra: bloques grises en vez de texto, con las medidas del

      '<div class="cols"><span></span><span></span><span></span></div>'+
    '</div>';
  var html =
    '<!doctype html><html><head><meta charset="utf-8">'+
    '<style>html,body{margin:0;height:100%}'+
    'body{font-family:-apple-system,sans-serif;background:#fff;color:#8a8a8a;font-size:13px}'+
    '.pg{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:16px;background:#fff}'+

    '.nav{display:flex;gap:12px}.nav i{width:44px;height:8px;background:#E5E5E5}'+
    '.hero{flex:1;background:#EDEDED}'+
    '.texto{display:flex;flex-direction:column;gap:8px;max-width:60%}'+
    '.t1{height:14px;width:60%;background:#E5E5E5}'+

function formatCfg(){
  try{
    el("cfg").value = JSON.stringify(JSON.parse(el("cfg").value), null, 2);
    validarCfg();
  }catch(e){ msg("smsg","JSON invalido, no se puede formatear.",true); }
}

/* Valida antes de guardar. El fallo tipico es referenciar en cookiePatterns o
   autoBlock una categoria que no existe en categories: se guardaba sin quejarse
   y el fallo solo aparecia en produccion. */
function validarCfg(){
  var res = [], obj = null, fatal = false;
  var crudo = (el("cfg") && el("cfg").value || "").trim();
  if(!crudo){
    var c0 = el("checks"); if(c0){ c0.innerHTML = ""; c0.classList.add("hide"); }
    return true;                       // sin datos todavia: no hay nada que validar
  }
  try{
    obj = JSON.parse(crudo);
    res.push({s:"pass", t:"<b>JSON valido.</b>"});
  }catch(e){
    res.push({s:"fail", t:"<b>JSON invalido.</b> "+esc(e.message)});
    fatal = true;
  }
  if(obj){
    var cats = (obj.categories||[]).map(function(c){ return c.id; });
    if(!cats.length){
      res.push({s:"fail", t:"No hay <b>categories</b> definidas."}); fatal = true;
    } else {
      res.push({s:"pass", t:"Categorias: <b>"+cats.map(esc).join(", ")+"</b>"});
    }
    var huerfanas = [];
    (obj.cookiePatterns||[]).forEach(function(p){
      if(p && typeof p==="object" && p.category && cats.indexOf(p.category)<0)
        huerfanas.push("cookiePatterns \u2192 "+p.category);
    });
    (obj.autoBlock||[]).forEach(function(r){
      if(r && r.category && cats.indexOf(r.category)<0)
        huerfanas.push("autoBlock \u2192 "+r.category);
    });
    if(huerfanas.length){
      res.push({s:"fail", t:"Categorias inexistentes: <b>"+huerfanas.map(esc).join(", ")+"</b>"});
      fatal = true;
    } else if(cats.length){
      res.push({s:"pass", t:"Todas las categorias referenciadas existen."});
    }
    var ab = (obj.autoBlock||[]).length;
    res.push({s: ab?"pass":"warn",
      t: ab ? "Bloqueo automatico: <b>"+ab+" regla(s)</b>."
            : "<b>autoBlock vacio</b>: no se bloquea ningun script, solo se borran cookies despues."});
    var sinCat = (obj.cookiePatterns||[]).filter(function(p){ return typeof p==="string"; }).length;
    if(sinCat) res.push({s:"warn",
      t:"<b>"+sinCat+" patron(es) sin categoria</b>: formato antiguo, se borran solo si la analitica queda denegada."});
    if(obj.webfont) res.push({s:"warn",
      t:"<b>webfont activo</b>: el banner pide tipografias a Google, generando una conexion a un tercero."});
    avisosApariencia(obj, res);
  avisosIdioma(obj, res);
  avisosPolitica(obj, res);
  avisosCss(obj, res);
  }
  el("ed-wrap").classList.toggle("bad", fatal);
  var b = el("btn-save"); if(b) b.disabled = fatal;
  var caja = el("checks");
  if(caja){
    var soloFallos = res.filter(function(c){ return c.s === "fail"; });
    caja.innerHTML = soloFallos.map(function(c){
      return '<div class="check fail"><span class="ic">!</span><span>'+c.t+'</span></div>';
    }).join('');
    caja.classList.toggle("hide", !soloFallos.length);
  }
  return !fatal;
}

/* Avisos de legibilidad. Nunca bloquean: solo advierten de combinaciones que
   dejarian el banner dificil de leer o de usar. */
function hexToRgb(h){
  if(!h) return null;
  h = String(h).trim();
  var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(h);
  if(!m) return null;
  var x = m[1];
  if(x.length===3) x = x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
  return [parseInt(x.slice(0,2),16), parseInt(x.slice(2,4),16), parseInt(x.slice(4,6),16)];
}
/* Luminancia relativa y ratio de contraste segun WCAG 2.1 */
function luminancia(rgb){
  var c = rgb.map(function(v){
    v = v/255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function contraste(a, b){
  var ra = hexToRgb(a), rb = hexToRgb(b);
  if(!ra || !rb) return null;
  var la = luminancia(ra), lb = luminancia(rb);
  var hi = Math.max(la,lb), lo = Math.min(la,lb);
  return (hi + 0.05) / (lo + 0.05);
}
function px(v){
  var m = /^(-?[\d.]+)px$/.exec(String(v||"").trim());
  return m ? parseFloat(m[1]) : null;
}
// Si una categoria no esta traducida, el banner cae al idioma que tenga y esa
// fila aparece en espanol dentro de un panel en ingles. No rompe nada, pero
// queda raro y conviene decirlo.
/* Un url() a otro dominio dentro del CSS es una conexion a un tercero antes
   de que el visitante decida: el mismo problema que el webfont de Google. */
function avisosCss(o, res){
  var t = o.customCss;
  if(!t || typeof t !== "string") return;
  if(/@import/i.test(t))
    // El verbo va dentro del <b> a proposito: tr() aparta lo que hay en <code>,
    // y eso partia la frase dejando "usa" suelto, demasiado corto para que el
    // traductor lo sustituya sin riesgo de meterse dentro de otras palabras.
    res.push({s:"warn", t:"<b>El CSS a medida usa @import</b>: se ignora, porque "+
      "traeria una hoja de otro dominio sin consentimiento."});
  var fuera = (t.match(/url\(\s*['"]?https?:\/\/[^)]*\)/gi) || []).length;
  if(fuera)
    res.push({s:"warn", t:"<b>El CSS a medida carga recursos de otro dominio</b>: "+fuera+
      ". Esa peticion sale antes de que el visitante acepte. Mejor incrustarlos como data URI."});
}

function avisosPolitica(o, res){
  var u = o.policyUrl;
  var vacio = !u || (typeof u === "object" && !u.es && !u.en);
  if(vacio){
    // Mercado objetivo: Estados Unidos. La CCPA/CPRA exige un "notice at
    // collection" con enlace a la politica antes de recoger datos personales;
    // Colorado, Connecticut y Virginia piden lo equivalente.
    res.push({s:"warn", t:"<b>Sin URL de politica</b>: el banner no mostrara el enlace. "+
      "La CCPA/CPRA exige avisar en el momento de la recogida y enlazar la politica de privacidad."});
    return;
  }
  if(typeof u === "object"){
    ["es","en"].forEach(function(lg){
      if(!u[lg]) res.push({s:"warn", t:"Sin URL de politica en <b>"+(lg==="es"?"espanol":"ingles")+
        "</b>: en ese idioma no se vera el enlace."});
    });
  }
  // Un esquema raro no se pinta, asi que mejor decirlo aqui que dejar al
  // cliente preguntandose por que no sale el enlace.
  var vals = (typeof u === "object") ? [u.es, u.en] : [u];
  vals.forEach(function(v){
    if(v && !/^(https?:\/\/|\/|#)/i.test(String(v).trim()) && /^[a-z][a-z0-9+.-]*:/i.test(String(v).trim()))
      res.push({s:"warn", t:"La URL <b>"+esc(v)+"</b> no se aceptara: solo se admite http, https o una ruta del propio sitio."});
  });
}

function avisosIdioma(o, res){
  if(o.autoDetectLanguage === false) return;   // sin deteccion, solo se usa uno
  var idiomas = ["es", "en"];
  var cats = o.categories || [];
  idiomas.forEach(function(lg){
    var faltan = cats.filter(function(c){
      var l = c.label, d = c.desc;
      var sinL = l && typeof l === "object" && !l[lg];
      var sinD = d && typeof d === "object" && !d[lg];
      return sinL || sinD;
    }).map(function(c){ return c.id; });
    if(faltan.length) res.push({s:"warn",
      t:"Sin traducir al <b>"+(lg==="es"?"espanol":"ingles")+"</b>: "+faltan.join(", ")+
        ". Esa fila del panel saldra en el otro idioma."});
  });
}

function avisosApariencia(o, res){
  var C = o.colors || {}, B = o.banner || {}, P = o.panel || {}, T = o.typography || {}, H = o.chip || {};
  var pares = [
    [B.background || C.ink,   B.color || C.text,          "texto del banner"],
    [P.background || C.panelBg, C.heading,                "titulos del panel"],
    [P.background || C.panelBg, C.body,                   "descripciones del panel"],
    [(o.buttons && o.buttons.accept && o.buttons.accept.background) || C.accent,
     (o.buttons && o.buttons.accept && o.buttons.accept.color) || C.textBright, "boton de aceptar"],
    [H.background || C.panelBg, H.color || C.body,        "pill de reapertura"]
  ];
  pares.forEach(function(par){
    var r = contraste(par[0], par[1]);
    if(r === null) return;                       // no son hex: no se puede medir
    if(r < 3)      res.push({s:"warn", t:"Contraste muy bajo en el <b>"+par[2]+"</b> ("+r.toFixed(1)+":1). Por debajo de 3:1 cuesta leerlo."});
    else if(r < 4.5) res.push({s:"warn", t:"Contraste justo en el <b>"+par[2]+"</b> ("+r.toFixed(1)+":1). WCAG pide 4.5:1 para texto normal."});
  });
  var bw = px(B.maxWidth), pw = px(P.maxWidth);
  if(bw !== null && bw < 280) res.push({s:"warn", t:"<b>Ancho del banner</b>: "+bw+"px. Por debajo de 280px el contenido se desborda."});
  if(pw !== null && pw < 300) res.push({s:"warn", t:"<b>Ancho del panel</b>: "+pw+"px. Los interruptores y sus textos no caben bien."});
  var ts = px(T.bannerText && T.bannerText.size), cs = px(T.catDesc && T.catDesc.size);
  if(ts !== null && ts < 12) res.push({s:"warn", t:"<b>Texto del banner</b>: "+ts+"px. Por debajo de 12px es dificil de leer en movil."});
  if(cs !== null && cs < 11) res.push({s:"warn", t:"<b>Descripcion de categorias</b> a "+cs+"px: demasiado pequeno para un texto legal."});
  if(H.enabled === false) res.push({s:"warn", t:"<b>Pill desactivado</b>: sin el, el visitante no puede reabrir el panel para cambiar de opinion."});
  if((H.mode === "image" || H.mode === "both") && !H.image)
    res.push({s:"pass", t:"El pill usa el <b>icono incluido</b>. Pon una URL en <code>chip.image</code> si quieres el tuyo."});
  if(H.mode === "image" && H.image && !H.imageAlt)
    res.push({s:"warn", t:"Pill con solo imagen y <b>sin texto alternativo</b>: un lector de pantalla no sabra que es."});
}

function saveCfg(){
  if(!validarCfg()){ msg("smsg","Corrige los errores antes de guardar.",true); return; }
  var cfg = temaBase();
  if(!cfg){ msg("smsg","JSON invalido.",true); return; }
  j("POST","/dash/site/save",{site_id:current,config:cfg}).then(function(r){
    if(r.ok){
      // openTab repinta la pestana entera, asi que el mensaje se escribe
      // DESPUES de repintar o se pierde y parece que no se guardo nada.
      WIZ_PUBLICADA = r.d.version;
      marcarPublicado(cfg);
      _trasRecargar = "Guardado. Version " + r.d.version + ".";
      openTab("config");
    }
    else msg("smsg", r.d.error||"No se pudo guardar.", true);
  });
}

/* ---------------- INSTALAR ---------------- */
function buildSnippet(d){
  // El pre-bloqueador va INLINE y antes que nada: el bundle llega por red y
  // para entonces el parser del navegador ya habria lanzado las etiquetas.
  var rules = (d.config && d.config.autoBlock) || [];
  var cfgObj = '{siteId:"'+d.site_id+'",apiBase:"'+API+'"'+
    (rules.length ? ',autoBlock:'+JSON.stringify(rules) : '')+'}';
  var s = "<!-- Consent Banner. En el <head>, lo primero, una sola vez -->\n"+
    "<script>\nwindow.__consentConfig="+cfgObj+";\n";
  if(rules.length){
    s +=
'(function(){var C=window.__consentConfig||{},R=C.autoBlock||[];if(!R.length)return;\n'+
'var B={observer:null,blocked:[]};window.__consentBlocker=B;\n'+
'function H(s){try{return new URL(s,location.href).hostname.toLowerCase()}catch(e){return ""}}\n'+
'function hit(s){if(!s)return null;var h=H(s);if(!h||h===location.hostname.toLowerCase())return null;\n'+
'for(var i=0;i<R.length;i++){var r=R[i];if(!r||!r.match)continue;var m=String(r.match).toLowerCase().replace(/^\\*?\\.?/,"");\n'+
'if(h===m||h.slice(-(m.length+1))==="."+m)return r}return null}\n'+
'function kill(n,r){var s=n.getAttribute("src");n.type="text/plain";n.setAttribute("type","text/plain");\n'+
'n.setAttribute("data-consent-src",s);n.setAttribute("data-consent-category",r.category);n.removeAttribute("src");B.blocked.push(s)}\n'+
'B.observer=new MutationObserver(function(m){m.forEach(function(x){Array.prototype.forEach.call(x.addedNodes,function(n){\n'+
'if(n.tagName==="SCRIPT"){var r=hit(n.getAttribute("src"));if(r)kill(n,r)}})})});\n'+
'B.observer.observe(document.documentElement,{childList:true,subtree:true});\n'+
// Un <script> al que se le pone src y luego se inserta arranca la descarga AL
// insertarse: quitarle el src despues ya no lo para, y el observer avisa un
// microtask tarde. Por eso hay que mirarlo ANTES de que toque el documento,
// que es como se cargan GTM, HubSpot y practicamente todo lo que importa.
'B.rules=R;\n'+
'var P=Node.prototype,na=P.appendChild,ni=P.insertBefore,nr=P.replaceChild;\n'+
'function chk(n){if(!n||!R.length)return n;\n'+
'if(n.nodeType===1){if(n.tagName==="SCRIPT"){var r=hit(n.getAttribute&&n.getAttribute("src"));if(r)kill(n,r)}return n}\n'+
'if(n.nodeType===11&&n.querySelectorAll){Array.prototype.forEach.call(n.querySelectorAll("script[src]"),function(t){\n'+
'var r=hit(t.getAttribute("src"));if(r)kill(t,r)})}return n}\n'+
'P.appendChild=function(n){return na.call(this,chk(n))};\n'+
'P.insertBefore=function(n,f){return ni.call(this,chk(n),f)};\n'+
'P.replaceChild=function(n,o){return nr.call(this,chk(n),o)};\n'+
'B.patched=true;})();\n';
  }
  s += '<\/script>\n<script async src="'+API+'/consent-banner.js"><\/script>';
  return s;
}

/* ---------------- Codigo del enlace de reapertura ----------------
   Los estilos van en linea a proposito: el cliente pega el bloque en su tema
   y funciona sin tocar su CSS, que es lo unico que no controlamos.          */
function estiloTrigger(T){
  var st = (T && T.style) || {}, css = [];
  function add(k, v){ if(v) css.push(k + ":" + v); }
  if(T.mode === "button"){
    add("display","inline-block");
    add("background", st.background || "transparent");
    // Con fondo propio, el borde sobra: "currentColor" dibujaria un marco del
    // color del texto. Sin fondo si hace falta, o el boton no se veria.
    add("border", st.border || (st.background ? "0" : "1px solid currentColor"));
    add("border-radius", st.radius || "6px");
    add("padding", st.padding || "8px 14px");
    css.push("cursor:pointer");
  } else {
    css.push("background:none"); css.push("border:0"); css.push("padding:0");
    css.push("cursor:pointer");
    css.push("text-decoration:" + (st.underline === false ? "none" : "underline"));
  }
  add("color", st.color || "inherit");
  add("font-size", st.fontSize || "14px");
  add("font-weight", st.fontWeight || "500");
  add("font-family", st.fontFamily || "inherit");
  return css.join(";");
}

/* Convierte un enlace del propio sitio en disparador, conservando etiquetas,
   clases e hijos. Casi ningun cliente quiere nuestro boton con estilos en
   linea: quieren el suyo, que ya encaja con su footer.

   Se usa DOMParser, que construye el arbol sin ejecutar nada, y el resultado
   se muestra escapado como texto. Nunca se inyecta en esta pagina.          */
function convertirTrigger(){
  var caja = el("trig-conv"), src = el("trig-src");
  if(!caja || !src) return;
  var bruto = src.value.trim();
  if(!bruto){ caja.innerHTML = ""; return; }

  var obj; try { obj = JSON.parse(el("cfg") ? el("cfg").value : "{}"); } catch(e){ obj = {}; }
  var T = (obj && obj.trigger) || {};
  var txt = textoTrigger(T, LANG === "en" ? "en" : "es");

  var doc;
  try { doc = new DOMParser().parseFromString("<div id='r'>"+bruto+"</div>", "text/html"); }
  catch(e){ caja.innerHTML = '<p class="hint">No se pudo leer ese HTML.</p>'; return; }
  var raiz = doc.getElementById("r");
  var a = raiz.querySelector("a") || raiz.querySelector("button");
  if(!a){
    caja.innerHTML = '<p class="hint">No encuentro ningun enlace ahi dentro. '+
      'Pega el bloque completo, incluido su &lt;a&gt;.</p>';
    return;
  }

  // Un <button> en vez de <a>: muchos temas interceptan los clics en enlaces
  // para su propia navegacion y se quedarian con el evento.
  var b = doc.createElement("button");
  b.setAttribute("type", "button");
  b.setAttribute("data-consent-open", "");
  if(a.getAttribute("class")) b.setAttribute("class", a.getAttribute("class"));
  // El navegador da a los botones su propio fondo, borde y tipo: los anulamos
  // para que herede lo mismo que heredaba el enlace.
  var previo = a.getAttribute("style");
  b.setAttribute("style", "background:none;border:0;padding:0;cursor:pointer;font:inherit;"+
    "color:inherit;text-align:left" + (previo ? ";"+previo : ""));

  // Nos quedamos con los hijos del enlace (los span de adorno del tema) y solo
  // cambiamos el texto visible por el nuestro.
  while(a.firstChild) b.appendChild(a.firstChild);
  var conTexto = null;
  (function buscar(n){
    for(var i=0;i<n.childNodes.length;i++){
      var c = n.childNodes[i];
      if(c.nodeType === 3 && c.nodeValue.trim()){ conTexto = c; return; }
      if(c.nodeType === 1) buscar(c);
      if(conTexto) return;
    }
  })(b);
  if(conTexto) conTexto.nodeValue = txt; else b.appendChild(doc.createTextNode(txt));

  a.parentNode.replaceChild(b, a);

  caja.innerHTML =
    '<div class="snippet" id="trig-conv-code">'+ esc(raiz.innerHTML.trim()) +'</div>'+
    '<div class="row mt"><button class="btn ghost sm" onclick="copiarDe(\'trig-conv-code\',\'trig-msg3\')">Copiar codigo</button>'+
      '<span id="trig-msg3" class="msg"></span></div>';
}

function copiarDe(idOrigen, idMsg){
  var t = el(idOrigen).textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ msg(idMsg,"Copiado.",false); },
                                         function(){ msg(idMsg,"No se pudo copiar.",true); });
  } else {
    var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); msg(idMsg,"Copiado.",false); }
    catch(e){ msg(idMsg,"No se pudo copiar.",true); }
    document.body.removeChild(ta);
  }
}
/* ---- editor de dominios -----------------------------------------------
   Uno por ficha, con su aspa. La columna sigue guardandose separada por coma
   (es lo que lee origen_permitido), pero escribir las comas a mano se prestaba
   a dejar espacios, protocolos o rutas pegadas dentro del valor.          */
var DOMS = [];

/* Acepta lo que se pegue de la barra del navegador y deja solo el host. */
function domNormaliza(v){
  v = String(v || "").trim().toLowerCase();
  v = v.replace(/^[a-z][a-z0-9+.-]*:\/\//, "");   // protocolo
  v = v.replace(/^[^@\/]*@/, "");                 // usuario:clave@
  v = v.split("/")[0].split("?")[0].split("#")[0];
  v = v.replace(/\.+$/, "");
  return v;
}
function domValido(v){
  if(!v) return false;
  if(/^localhost(:\d+)?$/.test(v)) return true;
  return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:\d+)?$/.test(v);
}
function domPintaChips(){
  var c = el("dom-chips"); if(!c) return;
  c.innerHTML = DOMS.length
    ? DOMS.map(function(d, i){
        // Con el padre en la lista, el subdominio ya estaba cubierto.
        var cubierto = DOMS.some(function(o, j){
          return j !== i && o !== d && d.length > o.length && d.slice(-(o.length + 1)) === "." + o;
        });
        return '<span class="dom-chip'+(cubierto?' redundante':'')+'"'+
          (cubierto ? ' title="Ya cubierto por un dominio de la lista"' : '')+'>'+
          esc(d)+'<button type="button" onclick="domQuitar('+i+')" '+
          'aria-label="Quitar '+esc(d)+'">×</button></span>';
      }).join("")
    : '<span class="dom-vacio">Sin dominios: se aceptan registros desde cualquier sitio.</span>';
}
function domAnadir(v){
  var inp = el("dom-nuevo");
  var crudo = (typeof v === "string" ? v : (inp ? inp.value : ""));
  var nuevos = String(crudo).split(/[,\s]+/).map(domNormaliza).filter(function(x){ return !!x; });
  if(!nuevos.length){ msg("dmsg", "Escribe un dominio.", true); return; }
  var malos = nuevos.filter(function(x){ return !domValido(x); });
  if(malos.length){ msg("dmsg", "No parece un dominio: " + malos.join(", "), true); return; }
  var repes = nuevos.filter(function(x){ return DOMS.indexOf(x) >= 0; });
  nuevos.forEach(function(x){ if(DOMS.indexOf(x) < 0) DOMS.push(x); });
  if(inp){ inp.value = ""; inp.focus(); }
  domPintaChips();
  msg("dmsg", repes.length === nuevos.length
    ? "Ya estaba en la lista."
    : "Anadido. Dale a Guardar dominios para que surta efecto.", false);
}
// Pegar "a.com, b.com" de un tiron sigue funcionando: se parte en fichas.
function domPegar(ev){
  var t = (ev.clipboardData || window.clipboardData);
  if(!t) return;
  var txt = t.getData("text") || "";
  if(!/[,\s]/.test(txt.trim())) return;    // uno solo: que lo escriba normal
  ev.preventDefault();
  domAnadir(txt);
}
function domQuitar(i){
  DOMS.splice(i, 1); domPintaChips();
  msg("dmsg", "Quitado. Dale a Guardar dominios para que surta efecto.", false);
}
function guardarDominio(){
  var valor = DOMS.join(",");
  j("POST","/dash/site/domain",{site_id:current,domain:valor}).then(function(r){
    if(!r.ok){ msg("dmsg", r.d.error||"error", true); return; }
    // El resto del panel lee de aqui: sin esto los selectores siguen con los viejos.
    if(_datosSitio) _datosSitio.domain = r.d.domain !== undefined ? r.d.domain : valor;
    sites.forEach(function(s){ if(s.site_id === current) s.domain = valor; });
    if(DOM_ACTIVO && DOMS.indexOf(DOM_ACTIVO) < 0) DOM_ACTIVO = "";
    msg("dmsg","Guardado.",false);
  });
}

/* categories viaja como texto JSON desde la base */
function cats(raw){
  var vacio = '<span class="cat">sin datos</span>';
  if(!raw) return vacio;
  var o;
  try{ o = typeof raw==="string" ? JSON.parse(raw) : raw; }catch(e){ return vacio; }
  if(!o || typeof o!=="object") return vacio;
  var ks = Object.keys(o);
  if(!ks.length) return vacio;
  return '<div class="cats">'+ks.map(function(k){
    return '<span class="cat'+(o[k]?' on':'')+'">'+esc(k)+'</span>';
  }).join('')+'</div>';
}

/* ---------------- COOKIES DETECTADAS ---------------- */
/* El bundle reporta que NOMBRES de cookie aparecen en el sitio real (nunca su
   valor). Aqui se decide que es cada una. Solo las no esenciales acaban en
   cookiePatterns: una cookie de sesion o de seguridad no se debe borrar. */
var _ckCambios = {};     // nombre -> {category, status} pendiente de guardar

function viewCookies(d){
  var cats = (d.config && d.config.categories) || [];
  // Solo las categorias que el visitante puede denegar. Asignar una cookie a
  // una categoria bloqueada no tendria efecto: nunca se deniega, luego nunca
  // se borraria, que es justo lo que significa "esencial".
  window._ckCats = cats.filter(function(c){ return !c.locked; }).map(function(c){ return c.id; });
  el("tabbody").innerHTML =
    '<div class="card">'+
      '<div class="ck-head">'+
        '<div><h2 style="margin:0">Cookies detectadas en el sitio</h2>'+
        '<p class="sub" style="margin:4px 0 0">Clasifica cada una. Las esenciales nunca se borran.</p></div>'+
        '<div class="row">'+
          '<button class="btn ghost sm" onclick="aceptarSugerencias()">Aplicar sugerencias</button>'+
          '<button class="btn ghost sm" onclick="loadCookies()">Refrescar</button>'+
          '<button class="btn sm" id="ck-save" onclick="guardarCookies()">Guardar clasificacion</button>'+
        '</div>'+
      '</div>'+
      '<div id="ck-aviso"></div>'+
      '<div class="banner-nota">Aqui solo aparecen las cookies de <b>tu propio dominio</b>. '+
      'Las de terceros (<code>.google.com</code>, <code>.vimeo.com</code>) y las marcadas '+
      '<code>HttpOnly</code> no son visibles desde JavaScript, asi que ningun banner puede '+
      'detectarlas ni borrarlas. Para el informe de auditoria hay que anotarlas a mano desde '+
      'DevTools &rarr; Application &rarr; Cookies.</div>'+
      '<div id="ck-body"><div class="empty">Cargando...</div></div>'+
      '<div class="row mt"><span id="ck-msg" class="msg"></span></div>'+
    '</div>';
  loadCookies();
}

function loadCookies(){
  _ckCambios = {};
  j("GET","/dash/site/cookies?site_id="+encodeURIComponent(current)).then(function(r){
    if(!r.ok){ el("ck-body").innerHTML = '<div class="empty">No se pudieron cargar.</div>'; return; }
    window._ckRows = r.d.rows || [];
    pintarCookies();
  });
}

function pintarCookies(){
  var rows = window._ckRows || [], cats = window._ckCats || [];
  el("ck-aviso").innerHTML = avisoDeteccion(rows.length);
  if(!rows.length){
    el("ck-body").innerHTML = '<div class="empty">Todavia no se ha detectado ninguna cookie.</div>';
    return;
  }
  var pend = rows.filter(function(x){ return x.status==="nueva"; }).length;

  // Tipos entre los que se elige SOLO cuando la cookie no es necesaria.
  // Son las categorias no bloqueadas de la config: si el sitio no tiene
  // "marketing", aqui no aparece.
  var tipos = cats.filter(function(c){ return c !== "esencial"; });

  el("ck-body").innerHTML =
    '<div class="stats" id="ck-stats">'+
      '<div class="stat"><div class="n">'+rows.length+'</div><div class="l">Detectadas</div></div>'+
      '<div class="stat cus"><div class="n">'+pend+'</div><div class="l">Sin decidir</div></div>'+
      '<div class="stat acc"><div class="n">'+rows.filter(function(x){return x.category==="esencial";}).length+
        '</div><div class="l">Necesarias</div></div>'+
      '<div class="stat rej"><div class="n">'+rows.filter(function(x){
          return x.status==="asignada" && x.category && x.category!=="esencial"; }).length+
        '</div><div class="l">No necesarias</div></div>'+
    '</div>'+
    '<div class="table-wrap"><table class="ck-tbl"><thead><tr>'+
      '<th>Cookie</th><th>Que es</th><th>Categoria</th><th></th><th>Vista</th>'+
    '</tr></thead><tbody>'+
    rows.map(function(x){ return filaCookie(x, tipos); }).join('')+
    '</tbody></table></div>';
}

/* Una fila: la pregunta es binaria (necesaria o no). El desplegable de tipo
   solo tiene sentido cuando la respuesta es "no", y por eso se oculta. */
function filaCookie(x, tipos){
  var id = cssId(x.name);
  var esNecesaria   = x.category === "esencial";
  var esNoNecesaria = x.status === "asignada" && x.category && x.category !== "esencial";
  var sinDecidir    = !esNecesaria && !esNoNecesaria;

  var sug = "";
  if (x.sugerida === "esencial")      sug = '<span class="sug">se sugiere: necesaria</span>';
  else if (x.sugerida)                sug = '<span class="sug">se sugiere: no necesaria ('+esc(x.sugerida)+')</span>';
  else                                sug = '<span class="sug none">desconocida</span>';

  var desc = x.explicacion || "No esta en el catalogo. Averigua quien la escribe antes de decidir.";

  // Un solo desplegable con todo: sin decidir, esencial, y las categorias
  // que el sitio tenga configuradas.
  var opciones =
    '<option value=""'+(sinDecidir?" selected":"")+'>Sin decidir</option>'+
    '<option value="esencial"'+(esNecesaria?" selected":"")+'>Esencial (no se borra)</option>'+
    tipos.map(function(c){
      return '<option value="'+esc(c)+'"'+(x.category===c?" selected":"")+'>'+esc(c)+'</option>';
    }).join('');

  var clase = "ck-sel" + (esNecesaria ? " es-nec" : (esNoNecesaria ? " no-nec" : " sin-dec"));
  var nombreSeguro = esc(x.name).replace(/'/g,"");

  return '<tr'+(sinDecidir?' class="sin-decidir"':'')+' id="row_'+id+'">'+
    '<td><div class="ck-name">'+esc(x.name)+'</div>'+sug+'</td>'+
    '<td><div class="ck-desc">'+esc(desc)+'</div></td>'+
    '<td>'+
      '<select class="'+clase+'" id="tp_'+id+'" '+
        'onchange="ckTipo(\''+nombreSeguro+'\',this.value)">'+opciones+'</select>'+
    '</td>'+
    '<td><span class="nota-nec" id="nn_'+id+'" style="'+(esNecesaria?"":"display:none")+'">'+
      'Nunca se borra</span></td>'+
    '<td class="mono">'+esc(fecha(x.last_seen))+'<br><span style="font-size:10.5px">'+
      esc(x.hits)+' veces, '+esc(x.phase||"")+'</span></td>'+
  '</tr>';
}

function cssId(n){ return String(n).replace(/[^a-zA-Z0-9_]/g,"_"); }

/* Aviso segun el estado de la deteccion: si no esta activada, no llegaran datos. */
function avisoDeteccion(cuantas){
  var activa = window._cfgActual && window._cfgActual.cookieDiscovery === true;
  if(activa) return "";
  return '<div class="banner-info"><b>La deteccion esta apagada.</b> '+
    'Pon <code>"cookieDiscovery": true</code> en la configuracion para que el sitio '+
    'empiece a reportar que cookies aparecen. '+
    (cuantas ? 'Lo de abajo es lo que se detecto antes de apagarla.' : '')+'</div>';
}

/* Un solo desplegable decide todo: vacio = sin decidir, "esencial" = necesaria
   y no se borra nunca, cualquier otro valor = la categoria bajo la que se
   borrara cuando el visitante la deniegue. */
function ckTipo(nombre, valor){
  var fila = (window._ckRows||[]).filter(function(r){ return r.name===nombre; })[0];
  if(!fila) return;
  fila.category = valor;
  fila.status = valor ? "asignada" : "nueva";
  _ckCambios[nombre] = { category: fila.category, status: fila.status };

  // Repintar solo esta fila, para no perder el scroll ni cerrar el desplegable.
  var id = cssId(nombre);
  var sel = el("tp_"+id), nota = el("nn_"+id), tr = el("row_"+id);
  if(sel) sel.className = "ck-sel" + (valor === "esencial" ? " es-nec"
                                    : (valor ? " no-nec" : " sin-dec"));
  if(nota) nota.style.display = (valor === "esencial") ? "" : "none";
  if(tr) tr.className = valor ? "" : "sin-decidir";
  refrescarContadores();
  contarCambios();
}

/* Las tarjetas de arriba se recalculan sin rehacer la tabla entera. */
function refrescarContadores(){
  var rows = window._ckRows || [];
  var cont = el("ck-stats"); if(!cont) return;
  var nec = rows.filter(function(x){ return x.category === "esencial"; }).length;
  var no  = rows.filter(function(x){ return x.category && x.category !== "esencial"; }).length;
  cont.innerHTML =
    '<div class="stat"><div class="n">'+rows.length+'</div><div class="l">Detectadas</div></div>'+
    '<div class="stat cus"><div class="n">'+(rows.length-nec-no)+'</div><div class="l">Sin decidir</div></div>'+
    '<div class="stat acc"><div class="n">'+nec+'</div><div class="l">Necesarias</div></div>'+
    '<div class="stat rej"><div class="n">'+no+'</div><div class="l">No necesarias</div></div>';
}

function contarCambios(){
  var n = Object.keys(_ckCambios).length;
  msg("ck-msg", n ? n+" cambio(s) sin guardar. Pulsa Guardar." : "", false);
}

/* Responde por ti segun el catalogo: lo conocido como de sesion o seguridad
   queda como necesaria, lo demas como no necesaria con su tipo. Lo desconocido
   se queda sin decidir a proposito: eso lo tienes que mirar tu. */
function aceptarSugerencias(){
  var rows = window._ckRows || [];
  var tipos = (window._ckCats||[]).filter(function(c){ return c!=="esencial"; });
  var n = 0;
  rows.forEach(function(x){
    if(x.status === "asignada" || !x.sugerida) return;
    if(x.sugerida === "esencial"){
      x.category = "esencial"; x.status = "asignada";
    } else {
      if(tipos.indexOf(x.sugerida) < 0) return;   // ese tipo no existe en la config
      x.category = x.sugerida; x.status = "asignada";
    }
    _ckCambios[x.name] = { category: x.category, status: "asignada" };
    n++;
  });
  pintarCookies();
  msg("ck-msg", n ? (n+" cookie(s) respondidas. Revisa y pulsa Guardar.")
                  : "No hay sugerencias aplicables.", false);
}

function guardarCookies(){
  var items = Object.keys(_ckCambios).map(function(k){
    return { name:k, category:_ckCambios[k].category, status:_ckCambios[k].status };
  });
  if(!items.length){ msg("ck-msg","No hay cambios que guardar.", true); return; }
  // La clasificacion alimenta las sugerencias de bloqueo, asi que hay que
  // volver a pedirlas la proxima vez que se pinte el editor.
  window._ckDetectadas = undefined;
  j("POST","/dash/site/cookies/classify",{site_id:current, items:items}).then(function(r){
    if(!r.ok){ msg("ck-msg", r.d.error||"No se pudo guardar.", true); return; }
    // Volcar a cookiePatterns crea una version nueva de la config.
    j("POST","/dash/site/cookies/apply",{site_id:current}).then(function(r2){
      if(r2.ok){
        var n = (r2.d.anadidas||[]).length;
        var comp = (r2.d.completadas||[]).length;
        var cub = (r2.d.cubiertas||[]).length;
        var partes = [];
        if(n)    partes.push(n+" patron(es) nuevos");
        if(comp) partes.push(comp+" patron(es) antiguos completados con su categoria");
        if(cub)  partes.push(cub+" ya cubiertas por un patron mas corto");
        msg("ck-msg", partes.length
              ? "Guardado: "+partes.join(", ")+" (version "+r2.d.version+")."
              : "Guardado. Sin cambios en los patrones.", false);
        loadCookies();
      } else msg("ck-msg", r2.d.error||"Guardado, pero no se pudo aplicar.", true);
    });
  });
}

/* ---------------- CUENTA ---------------- */
/* ---------------- USUARIOS (solo admin) ---------------- */
var _usuarios = [], _sitiosTodos = [];

function viewUsuarios(){
  el("tabbody").innerHTML =
    '<div class="card" id="pend-card" style="margin-bottom:16px"></div>'+
    '<div class="card">'+
      '<div class="ck-head">'+
        '<div><h2>Usuarios</h2>'+
          '<p class="sub" style="margin:0">Cada usuario ve solo los sitios que le asignes. '+
          'Los super administradores ven todos y pueden gestionar cuentas.</p></div>'+
        '<button class="btn" onclick="modalNuevoUsuario()">Crear usuario</button>'+
      '</div>'+
      '<div id="u-body"><div class="empty">Cargando...</div></div>'+
    '</div>';
  cargarPendientes();
  cargarUsuarios();
}

/* Solicitudes de alta. Una cuenta pendiente no puede iniciar sesion, asi que
   esta bandeja es el unico sitio desde el que se le da acceso. */
function cargarPendientes(){
  j("GET","/dash/pending").then(function(r){
    var caja = el("pend-card");
    if(!caja) return;
    if(!r.ok){ caja.classList.add("hide"); return; }
    var filas = r.d.rows || [];
    if(!filas.length){ caja.classList.add("hide"); return; }
    caja.classList.remove("hide");
    caja.innerHTML =
      '<div class="ck-head"><div><h2>Solicitudes de acceso '+
        '<span class="ver-pill" style="border-color:var(--line);color:var(--muted)">'+filas.length+'</span></h2>'+
        '<p class="sub" style="margin:0">Estas personas pidieron una cuenta. No pueden entrar hasta que apruebes.</p>'+
      '</div></div>'+
      '<div class="table-wrap"><table class="ck-tbl"><thead><tr>'+
        '<th>Usuario</th><th>Pedida</th><th></th></tr></thead><tbody>'+
      filas.map(function(f){
        return '<tr><td><strong>'+esc(f.username)+'</strong></td>'+
          '<td class="sub">'+esc((f.created_at||"").slice(0,16).replace("T"," "))+'</td>'+
          '<td style="text-align:right;white-space:nowrap">'+
            '<button class="btn ghost sm" onclick="resolverAlta(\''+esc(f.username)+'\',\'rechazar\')">Rechazar</button> '+
            '<button class="btn sm" onclick="resolverAlta(\''+esc(f.username)+'\',\'aprobar\')">Aprobar</button>'+
          '</td></tr>';
      }).join('')+
      '</tbody></table></div><p class="hint" id="pend-msg"></p>';
  });
}

function resolverAlta(nombre, accion){
  if(accion === "rechazar" && !confirm("Rechazar la solicitud de "+nombre+"? Se borra, aunque podra volver a pedirla."))
    return;
  j("POST","/dash/pending/resolve",{username:nombre, accion:accion}).then(function(r){
    if(!r.ok) return msg("pend-msg", r.d.error||"No se pudo.", true);
    cargarPendientes();
    cargarUsuarios();     // un alta aprobada aparece ya en la tabla de abajo
  });
}

function cargarUsuarios(){
  j("GET","/dash/users").then(function(r){
    if(!r.ok){ el("u-body").innerHTML = '<div class="empty">No se pudieron cargar.</div>'; return; }
    _usuarios = r.d.users || []; _sitiosTodos = r.d.sites || [];
    pintarUsuarios();
  });
}

function pintarUsuarios(){
  el("u-body").innerHTML =
    '<div class="table-wrap"><table class="ck-tbl"><thead><tr>'+
      '<th>Usuario</th><th>Rol</th><th>Sitios asignados</th><th></th>'+
    '</tr></thead><tbody>'+ _usuarios.map(filaUsuario).join('') +'</tbody></table></div>'+
    '<p class="hint" id="u-msg"></p>';
}

function filaUsuario(u){
  var id = cssId(u.username), admin = (u.role === "super");
  // Solo el super llega a todos los sitios por definicion, asi que asignarle
  // sitios uno a uno no significaria nada. Un admin si se asigna.
  var sitios = admin
    ? '<span class="nota-nec">Todos los sitios</span>'
    : '<div class="u-sitios">'+ _sitiosTodos.map(function(s){
        var on = (u.sites || []).indexOf(s.site_id) !== -1;
        return '<label class="u-chk"><input type="checkbox" '+(on?"checked":"")+' '+
          'onchange="asignar(\''+esc(u.username)+'\',\''+esc(s.site_id)+'\',this.checked)" /> '+
          esc(s.name)+'</label>';
      }).join('') + (_sitiosTodos.length ? '' : '<span class="ck-desc">No hay sitios todavia.</span>')+'</div>';

  return '<tr id="u_'+id+'">'+
    '<td><div class="ck-name">'+esc(u.username)+'</div></td>'+
    '<td>'+(u.role === "super" ? '<span class="tag all">super admin</span>'
          : u.role === "admin" ? '<span class="tag all">admin</span>'
          : '<span class="tag custom">usuario</span>')+'</td>'+
    '<td style="white-space:normal">'+sitios+'</td>'+
    '<td style="text-align:right;white-space:nowrap">'+
      '<button class="btn ghost sm" onclick="modalPassUsuario(\''+esc(u.username)+'\')">Contrasena</button> '+
      '<button class="btn danger sm" onclick="modalBorrarUsuario(\''+esc(u.username)+'\')">Borrar</button>'+
    '</td>'+
  '</tr>';
}

/* Cada casilla manda la lista completa, no el cambio suelto: asi el servidor
   no tiene que adivinar el estado previo y dos pestanas abiertas no se pisan
   a medias. */
function asignar(usuario, siteId, marcado){
  var u = _usuarios.filter(function(x){ return x.username===usuario; })[0];
  if(!u) return;
  u.sites = u.sites || [];
  var i = u.sites.indexOf(siteId);
  if(marcado && i === -1) u.sites.push(siteId);
  if(!marcado && i !== -1) u.sites.splice(i,1);
  j("POST","/dash/users/assign",{username:usuario, sites:u.sites}).then(function(r){
    msg("u-msg", r.ok ? "Guardado." : (r.d.error || "No se pudo guardar."), !r.ok);
    if(!r.ok) cargarUsuarios();
  });
}

function modalNuevoUsuario(){
  var checks = _sitiosTodos.map(function(s){
    return '<label class="u-chk"><input type="checkbox" class="nu-site" value="'+esc(s.site_id)+'" /> '+
      esc(s.name)+'</label>';
  }).join('') || '<span class="ck-desc">No hay sitios todavia.</span>';
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Crear usuario</h3>'+
      '<p class="sub">Elige los sitios que podra ver. Se cambia despues cuando quieras.</p>'+
      '<div class="field"><label>Usuario</label><input id="nu-name" type="text" placeholder="maria" /></div>'+
      '<div class="field"><label>Contrasena</label><input id="nu-pass" type="password" placeholder="Minimo 8 caracteres" /></div>'+
      '<div class="field"><label>Rol</label><select id="nu-role" class="ck-sel" style="width:100%">'+
        '<option value="user">Usuario (solo los sitios que le asignes)</option>'+
        '<option value="admin">Administrador (sus sitios, no gestiona cuentas)</option>'+
        '<option value="super">Super administrador (todo)</option></select></div>'+
      '<div class="field"><label>Sitios</label><div class="u-sitios">'+checks+'</div></div>'+
      '<p class="hint" id="nu-msg"></p>'+
      '<div class="row mt"><button class="btn" onclick="crearUsuario()">Crear usuario</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
    '</div></div>';
}

function crearUsuario(){
  var sids = [];
  Array.prototype.forEach.call(document.querySelectorAll(".nu-site"), function(c){
    if(c.checked) sids.push(c.value);
  });
  j("POST","/dash/users/create",{
    username: val("nu-name"), password: val("nu-pass"),
    role: el("nu-role").value, sites: sids
  }).then(function(r){
    if(!r.ok){ msg("nu-msg", r.d.error || "No se pudo crear.", true); return; }
    cerrarModal(); cargarUsuarios();
  });
}

function modalPassUsuario(usuario){
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Contrasena de '+esc(usuario)+'</h3>'+
      '<p class="sub">Se cierran sus sesiones abiertas. No hace falta la anterior.</p>'+
      '<div class="field"><label>Contrasena nueva</label>'+
      '<input id="up-pass" type="password" placeholder="Minimo 8 caracteres" /></div>'+
      '<p class="hint" id="up-msg"></p>'+
      '<div class="row mt"><button class="btn" onclick="guardarPassUsuario(\''+esc(usuario)+'\')">Guardar contrasena</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
    '</div></div>';
}

function guardarPassUsuario(usuario){
  j("POST","/dash/users/password",{username:usuario, password:val("up-pass")}).then(function(r){
    if(!r.ok){ msg("up-msg", r.d.error || "No se pudo guardar.", true); return; }
    cerrarModal(); cargarUsuarios();
  });
}

function modalBorrarUsuario(usuario){
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Borrar a '+esc(usuario)+'</h3>'+
      '<p class="sub">Pierde el acceso al instante. Los sitios y sus registros no se tocan.</p>'+
      '<p class="hint" id="ub-msg"></p>'+
      '<div class="row mt"><button class="btn danger" onclick="borrarUsuario(\''+esc(usuario)+'\')">Si, borrar</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
    '</div></div>';
}

function borrarUsuario(usuario){
  j("POST","/dash/users/delete",{username:usuario}).then(function(r){
    if(!r.ok){ msg("ub-msg", r.d.error || "No se pudo borrar.", true); return; }
    cerrarModal(); cargarUsuarios();
  });
}

function viewCuenta(){
  el("tabbody").innerHTML =
    '<div class="cols">'+
      '<div class="card">'+
        '<h2>Cambiar contrasena</h2>'+
        '<p class="sub">Al cambiarla se cierran las demas sesiones abiertas.</p>'+
        '<div class="field"><label>Contrasena actual</label><input type="password" id="pw-actual" /></div>'+
        '<div class="field"><label>Contrasena nueva</label><input type="password" id="pw-nueva" placeholder="Minimo 8 caracteres" /></div>'+
        '<div class="row mt"><button class="btn" onclick="cambiarPass()">Guardar contrasena</button></div>'+
        '<p class="hint" id="pw-msg"></p>'+
      '</div>'+
      '<div class="card">'+
        '<h2>Sitios</h2>'+
        '<p class="sub">'+sites.length+' sitio(s) en esta cuenta.</p>'+
        sites.map(function(s){
          var safe = esc(s.name).replace(/'/g,"");
          return '<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft)">'+
            '<div style="min-width:0"><b style="font-size:13.5px">'+esc(s.name)+'</b>'+
            '<div style="font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace">'+esc(s.site_id)+'</div></div>'+
            (esSuper ? '<button class="btn danger sm" onclick="modalBorrarSitio(\''+s.site_id+'\',\''+safe+'\')">Borrar</button>' : '')+
          '</div>';
        }).join('')+
        '<div class="row mt"><button class="btn ghost sm" onclick="modalNuevoSitio()">+ Nuevo sitio</button></div>'+
      '</div>'+
    '</div>';
}
function cambiarPass(){
  j("POST","/dash/password",{actual:val("pw-actual"),nueva:val("pw-nueva")}).then(function(r){
    var m = el("pw-msg");
    if(r.ok){
      m.textContent = frase("Contrasena actualizada. Las demas sesiones se cerraron.");
      m.className = "hint ok";
      el("pw-actual").value=""; el("pw-nueva").value="";
    } else {
      m.textContent = (r.d && r.d.error) ? r.d.error : frase("No se pudo cambiar.");
      m.className = "hint err";
    }
  });
}

/* ---------------- modales ---------------- */
function cerrarModal(){ el("modal-host").innerHTML = ""; }
function modalNuevoSitio(){
  menuOpen = false; renderPicker();
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Nuevo sitio</h3><p class="sub">Puedes cambiar los dominios mas tarde.</p>'+
      '<div class="field"><label>Nombre</label><input id="n-name" type="text" placeholder="Tienda del cliente" maxlength="80" /></div>'+
      '<div class="field"><label>Dominio principal</label><input id="n-dom" type="text" placeholder="cliente.com" />'+
        '<span class="hint">Los demas se anaden despues en Instalar, uno a uno.</span></div>'+
      '<div class="row mt"><button class="btn" onclick="createSite()">Crear sitio</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
      '<p class="hint" id="n-msg"></p>'+
    '</div></div>';
  setTimeout(function(){ var e=el("n-name"); if(e) e.focus(); }, 30);
}
function createSite(){
  var name = val("n-name").trim();
  if(!name){ msg("n-msg","Pon un nombre para identificarlo.",true); return; }
  // Se limpia aqui tambien: pegar la barra del navegador es lo mas comodo.
  var dom = domLista(val("n-dom")).map(domNormaliza).filter(domValido).join(",");
  j("POST","/dash/site/create",{name:name,domain:dom}).then(function(r){
    if(r.ok){ current = r.d.site_id; cerrarModal(); tab = "instalar"; boot(); }
    else msg("n-msg", r.d.error||"No se pudo crear.", true);
  });
}
function modalBorrarSitio(id, name){
  if(!esSuper) return;   // el backend responde 403 igualmente
  menuOpen = false; renderPicker();
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Borrar "'+esc(name)+'"</h3>'+
      '<p class="sub">Se eliminan tambien su configuracion y todos sus registros de consentimiento. '+
      'Esta accion no se puede deshacer.</p>'+
      '<div class="row mt"><button class="btn danger" onclick="deleteSite(\''+id+'\')">Si, borrar</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
      '<p class="hint" id="del-msg"></p>'+
    '</div></div>';
}
function deleteSite(id){
  j("POST","/dash/site/delete",{site_id:id}).then(function(r){
    if(r.ok){
      cerrarModal();
      if(current===id) current = null;
      boot();
    } else msg("del-msg", r.d.error||"No se pudo borrar.", true);
  });
}

boot();
