<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consent Banner. Dashboard</title>
<style>
  :root{
    --ink:#14243D; --accent:#2E7D74; --accent-dark:#26665f;
    --cream:#f3eee1; --line:#e6e4dc; --line-soft:#f0eee8; --muted:#6b7280;
    --paper:#F7F6F2; --white:#fff; --danger:#c0392b; --ok:#2e7d32; --warn:#b45309;
    --radius:12px; --shadow:0 1px 2px rgba(20,36,61,.04), 0 4px 16px rgba(20,36,61,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--paper);color:#1c2531;font-size:14px;line-height:1.5}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
       background:var(--line-soft);padding:1px 5px;border-radius:4px}

  /* ---------- barra superior ---------- */
  .topbar{background:var(--ink);color:#fff;padding:0 20px;display:flex;align-items:center;
          gap:18px;height:56px;position:sticky;top:0;z-index:20}
  .brand{font-weight:700;letter-spacing:.01em;font-size:15px;white-space:nowrap}
  .brand span{opacity:.5;font-weight:400;margin-left:6px}
  .topbar .spacer{flex:1}
  .topbar .who{font-size:13px;opacity:.8}
  .icon-btn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;
            border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;
            transition:background .15s,border-color .15s}
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}

  .site-picker{position:relative}
  .site-current{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);
                border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:6px 12px;
                cursor:pointer;color:#fff;max-width:340px;transition:background .15s}
  .site-current:hover{background:rgba(255,255,255,.14)}
  .site-current .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .site-current .id{font-size:11.5px;opacity:.6;font-family:ui-monospace,Menlo,monospace}
  .site-current .caret{opacity:.6;font-size:10px;margin-left:2px}
  .site-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:320px;background:#fff;
             border:1px solid var(--line);border-radius:var(--radius);
             box-shadow:0 12px 40px rgba(20,36,61,.18);padding:6px;z-index:30}
  .site-menu .opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
                  cursor:pointer;color:#1c2531}
  .site-menu .opt:hover{background:var(--paper)}
  .site-menu .opt.sel{background:#eef5f3}
  .site-menu .opt .info{flex:1;min-width:0}
  .site-menu .opt b{display:block;font-size:13.5px;font-weight:600}
  .site-menu .opt small{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .site-menu .sep{height:1px;background:var(--line-soft);margin:6px 4px}
  .site-menu .add{display:block;width:100%;text-align:left;background:transparent;border:0;
                  padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--accent);
                  font-weight:600;font-size:13.5px}
  .site-menu .add:hover{background:var(--paper)}
  .mini-del{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);
            border-radius:7px;width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px;padding:0}
  .mini-del:hover{border-color:var(--danger);color:var(--danger)}

  /* ---------- layout ---------- */
  .shell{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;
          overflow-x:auto;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{border:0;background:transparent;padding:11px 16px;font-size:14px;cursor:pointer;
                 color:var(--muted);font-weight:500;border-bottom:2px solid transparent;
                 margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
  .tabbar button:hover{color:var(--ink)}
  .tabbar button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
        padding:20px;box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card h2{font-size:14px;margin:0 0 4px;font-weight:600}
  .card .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }

  /* ---------- editor ---------- */
  .editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
               flex-wrap:wrap;margin-bottom:12px}
  .editor-head .left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ver-chip{background:var(--cream);border-radius:999px;padding:3px 10px;font-size:11.5px;color:#6b5f3f}
  .editor-wrap{position:relative;border:1px solid var(--line);border-radius:10px;
               overflow:hidden;background:#fbfaf7;transition:border-color .15s}
  .editor-wrap.bad{border-color:var(--danger)}
  #cfg{width:100%;border:0;background:transparent;padding:14px;resize:vertical;
       font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
       line-height:1.65;min-height:520px;white-space:pre;tab-size:2;outline:none;display:block}
  .editor-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .checks{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.5}
  .check .ic{flex:none;width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;
             text-align:center;color:#fff;font-weight:700;margin-top:2px}
  .check.pass .ic{background:var(--ok)}
  .check.fail .ic{background:var(--danger)}
  .check.warn .ic{background:var(--warn)}

  /* ---------- botones ---------- */
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 17px;
       font-weight:600;cursor:pointer;font-size:13.5px;transition:background .15s}
  .btn:hover{background:var(--accent-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--paper);border-color:var(--ink)}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #e8c9c4}
  .btn.danger:hover{background:#fdf5f4;border-color:var(--danger)}
  .btn.sm{padding:7px 13px;font-size:12.5px}
  a.btn{text-decoration:none;display:inline-block}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.mt{margin-top:12px}

  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:500}
  .field + .field{margin-top:14px}
  input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:9px;
       padding:10px 12px;font-size:13.5px;background:#fff;transition:border-color .15s}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
  .hint.ok{color:var(--ok)} .hint.err{color:var(--danger)}

  /* ---------- snippet ---------- */
  .snippet{background:var(--ink);color:#d3e6ff;border-radius:10px;padding:16px;
           font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;
           line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto}
  .steps{counter-reset:s;margin:0 0 16px;padding:0;list-style:none}
  .steps li{counter-increment:s;position:relative;padding-left:30px;font-size:13px;
            color:#404a58;margin-bottom:9px;line-height:1.55}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;
            border-radius:50%;background:var(--cream);color:#6b5f3f;font-size:11px;
            font-weight:700;text-align:center;line-height:20px}

  /* ---------- registros ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px}
  .stat .n{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .stat.acc .n{color:var(--ok)} .stat.rej .n{color:var(--danger)} .stat.cus .n{color:var(--warn)}
  .table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:520px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  th{color:var(--muted);font-weight:600;background:var(--paper);position:sticky;top:0;
     font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fcfbf8}
  td.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .tag{display:inline-block;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:600}
  .tag.all{background:#e6f4ea;color:#1e6b36}
  .tag.none{background:#fdeceb;color:#a5342a}
  .tag.custom{background:#fdf0dc;color:#8a5a12}
  .cats{display:flex;gap:4px;flex-wrap:wrap}
  .cat{border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:600;
       background:var(--line-soft);color:var(--muted)}
  .cat.on{background:#e6f4ea;color:#1e6b36}

  /* ---------- panel visual de apariencia ---------- */
  .modes{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);
         border-radius:9px;padding:3px}
  .modes button{border:0;background:transparent;padding:6px 14px;border-radius:7px;
                font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500}
  .modes button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,36,61,.08)}
  .vis{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:1050px){ .vis{grid-template-columns:1fr} }
  .group{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .group > summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13px;
                   background:var(--paper);list-style:none;display:flex;
                   align-items:center;justify-content:space-between}
  .group > summary::-webkit-details-marker{display:none}
  .group > summary::after{content:"\25BE";font-size:10px;color:var(--muted);transition:transform .15s}
  .group[open] > summary::after{transform:rotate(180deg)}
  .group .body{padding:14px}
  .ctl{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:9px}
  .ctl:last-child{margin-bottom:0}
  .ctl > label{margin:0;font-size:12px}
  .ctl input[type=text]{padding:7px 9px;font-size:12.5px}
  .ctl select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
              font-size:12.5px;background:#fff}
  .ctl .colorbox{display:flex;gap:7px;align-items:center}
  .ctl input[type=color]{width:34px;height:31px;padding:2px;border:1px solid var(--line);
                         border-radius:7px;background:#fff;cursor:pointer;flex:none}
  .ctl .colorbox input[type=text]{flex:1;font-family:ui-monospace,Menlo,monospace}
  .ctl .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#1c2531}
  .preview{position:sticky;top:76px;border:1px solid var(--line);border-radius:10px;
           overflow:hidden;background:#fff}
  .preview .bar{padding:9px 13px;background:var(--paper);border-bottom:1px solid var(--line);
                font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .preview iframe{width:100%;height:520px;border:0;display:block;background:#fbfaf7}
  /* ---------- cookies detectadas ---------- */
  .ck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
           flex-wrap:wrap;margin-bottom:14px}
  .banner-info{background:#fdf0dc;border:1px solid #f0d9ae;color:#7a5510;
               border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;
               line-height:1.55}
  .banner-info b{font-weight:700}
  .ck-tbl td{vertical-align:middle}
  .ck-name{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#1c2531;font-weight:600}
  .ck-desc{font-size:11.5px;color:var(--muted);white-space:normal;max-width:330px;line-height:1.45}
  .ck-sel{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;
          background:#fff;min-width:140px}
  .si-no{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .si-no button{border:0;background:#fff;padding:7px 14px;font-size:12.5px;cursor:pointer;
                color:var(--muted);font-weight:600;white-space:nowrap}
  .si-no button + button{border-left:1px solid var(--line)}
  .si-no button:hover{background:var(--paper)}
  .si-no button.on.si{background:#e6f4ea;color:#1e6b36}
  .si-no button.on.no{background:#fdeceb;color:#a5342a}
  tr.sin-decidir{background:#fffdf7}
  tr.sin-decidir .ck-name{color:#8a5a12}
  .nota-nec{font-size:11.5px;color:var(--ok);font-weight:600}
  .sug{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;
       padding:2px 7px;background:#eef5f3;color:#2c6b5d;margin-left:6px;white-space:nowrap}
  .sug.none{background:var(--line-soft);color:var(--muted)}
  .st{display:inline-block;border-radius:999px;padding:2.5px 9px;font-size:11px;font-weight:600}
  .st.nueva{background:#fdf0dc;color:#8a5a12}
  .st.asignada{background:#e6f4ea;color:#1e6b36}
  .st.ignorada{background:var(--line-soft);color:var(--muted)}
  .msg{font-size:12.5px}
  .ok{color:var(--ok)} .err{color:var(--danger)}
  .empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13.5px}
  .hide{display:none}

  /* ---------- login ---------- */
  #login{max-width:360px;margin:14vh auto;padding:0 20px}
  #login .card{padding:30px}
  #login h1{font-size:18px;margin:0 0 4px;text-align:center}
  #login .sub{text-align:center}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,36,61,.35);z-index:40;
            display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:var(--radius);max-width:440px;width:100%;
         padding:24px;box-shadow:0 24px 70px rgba(20,36,61,.3)}
  .modal h3{margin:0 0 4px;font-size:16px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card">
    <h1>Consent Banner</h1>
    <p class="sub">Entra para gestionar tus sitios.</p>
    <div class="field"><label>Usuario</label><input id="u" type="text" value="admin" /></div>
    <div class="field"><label>Contrasena</label><input id="p" type="password" value="admin" /></div>
    <div class="row mt"><button class="btn" style="flex:1" onclick="login()">Entrar</button></div>
    <p class="hint" id="lmsg"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="brand">Consent Banner<span>Dashboard</span></div>
    <div class="site-picker" id="picker"></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="icon-btn" onclick="logout()">Salir</button>
  </div>
  <div class="shell">
    <div class="tabbar" id="tabbar"></div>
    <div id="tabbody"></div>
  </div>
</div>

<div id="modal-host"></div>

<script>
var API = location.origin;
var current = null, tab = "config", sites = [], menuOpen = false;

/* ---------------- utilidades ---------------- */
function j(method, path, body){
  return fetch(API+path, {method:method, headers:{"Content-Type":"application/json"},
    credentials:"include", body: body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().then(function(d){ return {ok:r.ok, d:d}; })
                     .catch(function(){ return {ok:r.ok, d:{}}; });
    });
}
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:""; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function msg(id,t,err){var e=el(id); if(!e)return; e.textContent=t; e.className="msg "+(err?"err":"ok");}
function show(which){
  el("login").classList.toggle("hide", which!=="login");
  el("app").classList.toggle("hide", which!=="app");
}
function fecha(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  var p = function(n){ return n<10 ? "0"+n : ""+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+
         " "+p(d.getHours())+":"+p(d.getMinutes());
}

/* ---------------- sesion ---------------- */
function login(){
  j("POST","/dash/login",{username:val("u"),password:val("p")}).then(function(r){
    if(r.ok){ boot(); } else { msg("lmsg", r.d.error||"No se pudo entrar.", true); }
  });
}
function logout(){ j("POST","/dash/logout").then(function(){ location.reload(); }); }

function boot(){
  j("GET","/dash/me").then(function(r){
    if(!r.ok){ show("login"); return; }
    show("app");
    el("who").textContent = r.d.username;
    sites = r.d.sites || [];
    var existe = sites.filter(function(s){ return s.site_id===current; }).length;
    if(!current || !existe){ current = sites.length ? sites[0].site_id : null; }
    renderPicker();
    renderTabs();
    openTab(tab);
  });
}

/* ---------------- selector de sitio ---------------- */
function renderPicker(){
  var p = el("picker");
  if(!sites.length){
    p.innerHTML = '<button class="icon-btn" onclick="modalNuevoSitio()">+ Crear primer sitio</button>';
    return;
  }
  var cur = sites.filter(function(s){return s.site_id===current;})[0] || sites[0];
  p.innerHTML =
    '<div class="site-current" onclick="toggleMenu(event)">'+
      '<div style="min-width:0">'+
        '<div class="nm">'+esc(cur.name)+'</div>'+
        '<div class="id">'+esc(cur.site_id)+'</div>'+
      '</div><span class="caret">&#9660;</span>'+
    '</div>'+
    (menuOpen ? renderMenu() : '');
}
function renderMenu(){
  return '<div class="site-menu" onclick="event.stopPropagation()">'+
    sites.map(function(s){
      var safe = esc(s.name).replace(/'/g,"");
      return '<div class="opt'+(s.site_id===current?' sel':'')+'" onclick="pickSite(\''+s.site_id+'\')">'+
        '<div class="info"><b>'+esc(s.name)+'</b><small>'+esc(s.site_id)+'</small></div>'+
        '<button class="mini-del" title="Borrar sitio" onclick="event.stopPropagation();modalBorrarSitio(\''+
          s.site_id+'\',\''+safe+'\')">&times;</button>'+
      '</div>';
    }).join('')+
    '<div class="sep"></div>'+
    '<button class="add" onclick="modalNuevoSitio()">+ Nuevo sitio</button>'+
  '</div>';
}
function toggleMenu(e){ if(e) e.stopPropagation(); menuOpen = !menuOpen; renderPicker(); }
document.addEventListener("click", function(){ if(menuOpen){ menuOpen=false; renderPicker(); } });
function pickSite(id){ current = id; menuOpen = false; renderPicker(); openTab(tab); }

/* ---------------- pestanas ---------------- */
var TABS = [
  {id:"config",    label:"Configuracion"},
  {id:"instalar",  label:"Instalar"},
  {id:"cookies",   label:"Cookies detectadas"},
  {id:"registros", label:"Registros"},
  {id:"cuenta",    label:"Cuenta"}
];
function renderTabs(){
  el("tabbar").innerHTML = TABS.map(function(t){
    return '<button class="'+(t.id===tab?'on':'')+'" onclick="openTab(\''+t.id+'\')">'+t.label+'</button>';
  }).join('');
}
function openTab(id){
  tab = id; renderTabs();
  if(id==="cuenta") return viewCuenta();
  if(!current){
    el("tabbody").innerHTML = '<div class="card"><div class="empty">Crea un sitio para empezar.</div></div>';
    return;
  }
  j("GET","/dash/site/get?site_id="+encodeURIComponent(current)).then(function(r){
    if(!r.ok){
      el("tabbody").innerHTML = '<div class="card"><div class="empty">No se pudo cargar el sitio.</div></div>';
      return;
    }
    window._cfgActual = r.d.config || {};
    if(id==="config")    viewConfig(r.d);
    if(id==="instalar")  viewInstalar(r.d);
    if(id==="registros") viewRegistros(r.d);
    if(id==="cookies")   viewCookies(r.d);
  });
}

/* ---------------- CONFIGURACION ---------------- */
var cfgMode = "visual";   // visual | json

function viewConfig(d){
  el("tabbody").innerHTML =
    '<div class="card">'+
      '<div class="editor-head">'+
        '<div class="left"><h2 style="margin:0">Configuracion del sitio</h2>'+
          '<span class="ver-chip">version '+esc(String(d.version))+'</span></div>'+

/* lectura y escritura por ruta "a.b.c" */
function getPath(o, path){
  var parts = path.split("."), v = o;
  for(var i=0;i<parts.length;i++){
    if(v==null || typeof v!=="object") return undefined;
    v = v[parts[i]];
  }
  return v;
}
function setPath(o, path, value){
  var parts = path.split("."), cur = o;
  for(var i=0;i<parts.length-1;i++){
    if(typeof cur[parts[i]]!=="object" || cur[parts[i]]===null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  var last = parts[parts.length-1];
  // Cadena vacia = "quitalo y usa el valor por defecto del bundle".
  if(value==="" || value===undefined) delete cur[last];
  else cur[last] = value;
}

    return;

function control(obj, it){
  var v = getPath(obj, it.p);
  var id = "c_"+it.p.replace(/\./g,"_");
  var body = "";
  if(it.k==="color"){
    var hex = /^#[0-9a-fA-F]{6}$/.test(v||"") ? v : "#ffffff";
    body = '<div class="colorbox">'+
      '<input type="color" value="'+hex+'" oninput="onCtl(\''+it.p+'\',this.value,\''+id+'\')" />'+
      '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="por defecto" '+
        'oninput="onCtl(\''+it.p+'\',this.value)" /></div>';
  } else if(it.k==="select"){
    body = '<select id="'+id+'" onchange="onCtl(\''+it.p+'\',this.value)">'+
      '<option value="">por defecto</option>'+
      it.opts.map(function(o){
        return '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';
      }).join('')+'</select>';
  } else if(it.k==="bool"){
    // El valor por defecto de cada opcion lo dice el propio control (it.def):
    // dar por hecho "activo" mostraria encendido algo que el bundle tiene apagado.
    var marcado = (v === undefined || v === null) ? (it.def !== false) : (v !== false);
    body = '<label class="chk"><input type="checkbox" id="'+id+'"'+(marcado?' checked':'')+
      ' onchange="onCtl(\''+it.p+'\', this.checked?true:false)" /> activo</label>';
  } else if(it.k==="num"){
    // Numeros como numeros: guardarlos como texto rompe las comparaciones del bundle.
    body = '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(it.ph||"")+'" '+
      'oninput="onCtl(\''+it.p+'\', this.value===\'\' ? \'\' : Number(this.value))" />';
  } else {
    body = '<input type="text" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(it.ph||"por defecto")+'" '+
      'oninput="onCtl(\''+it.p+'\',this.value)" />';
  }
  return '<div class="ctl"><label>'+esc(it.l)+'</label>'+body+'</div>';
}

var _prevTimer = null;
function onCtl(path, value, mirrorId){
  var obj;
  try{ obj = JSON.parse(el("cfg").value); }catch(e){ return; }
  setPath(obj, path, value);
  el("cfg").value = JSON.stringify(obj, null, 2);
  if(mirrorId){ var m = el(mirrorId); if(m) m.value = value; }   // color -> campo de texto
  validarCfg();
  clearTimeout(_prevTimer);
  _prevTimer = setTimeout(refrescarPreview, 400);   // el iframe se rehace, no en cada tecla
}

/* La vista previa monta el bundle real dentro de un iframe con la config
   que hay en el editor, sin guardar nada. */

  cfg.consentVersion = "preview-" + Date.now();   // fuerza que el banner se muestre siempre

/* Valida antes de guardar. El fallo tipico es referenciar en cookiePatterns o
   autoBlock una categoria que no existe en categories: se guardaba sin quejarse
   y el fallo solo aparecia en produccion. */
function validarCfg(){
  var res = [], obj = null, fatal = false;
  try{
    obj = JSON.parse(el("cfg").value);
    res.push({s:"pass", t:"<b>JSON valido.</b>"});
  }catch(e){
    res.push({s:"fail", t:"<b>JSON invalido.</b> "+esc(e.message)});
    fatal = true;
  }
  if(obj){
    var cats = (obj.categories||[]).map(function(c){ return c.id; });
    if(!cats.length){
      res.push({s:"fail", t:"No hay <b>categories</b> definidas."}); fatal = true;
    } else {
      res.push({s:"pass", t:"Categorias: <b>"+cats.map(esc).join(", ")+"</b>"});
    }
    var huerfanas = [];
    (obj.cookiePatterns||[]).forEach(function(p){
      if(p && typeof p==="object" && p.category && cats.indexOf(p.category)<0)
        huerfanas.push("cookiePatterns \u2192 "+p.category);
    });
    (obj.autoBlock||[]).forEach(function(r){
      if(r && r.category && cats.indexOf(r.category)<0)
        huerfanas.push("autoBlock \u2192 "+r.category);
    });
    if(huerfanas.length){
      res.push({s:"fail", t:"Categorias inexistentes: <b>"+huerfanas.map(esc).join(", ")+"</b>"});
      fatal = true;
    } else if(cats.length){
      res.push({s:"pass", t:"Todas las categorias referenciadas existen."});
    }
    var ab = (obj.autoBlock||[]).length;
    res.push({s: ab?"pass":"warn",
      t: ab ? "Bloqueo automatico: <b>"+ab+" regla(s)</b>."
            : "<b>autoBlock vacio</b>: no se bloquea ningun script, solo se borran cookies despues."});
    var sinCat = (obj.cookiePatterns||[]).filter(function(p){ return typeof p==="string"; }).length;
    if(sinCat) res.push({s:"warn",
      t:"<b>"+sinCat+" patron(es) sin categoria</b>: formato antiguo, se borran solo si la analitica queda denegada."});
    if(obj.webfont) res.push({s:"warn",
      t:"<b>webfont activo</b>: el banner pide tipografias a Google, generando una conexion a un tercero."});
    avisosApariencia(obj, res);
  }
  el("ed-wrap").classList.toggle("bad", fatal);
  var b = el("btn-save"); if(b) b.disabled = fatal;
  el("checks").innerHTML = res.map(function(c){
    var ic = c.s==="pass" ? "&#10003;" : (c.s==="fail" ? "!" : "i");
    return '<div class="check '+c.s+'"><span class="ic">'+ic+'</span><span>'+c.t+'</span></div>';
  }).join('');
  return !fatal;
}

/* Avisos de legibilidad. Nunca bloquean: solo advierten de combinaciones que
   dejarian el banner dificil de leer o de usar. */
function hexToRgb(h){
  if(!h) return null;
  h = String(h).trim();
  var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(h);
  if(!m) return null;
  var x = m[1];
  if(x.length===3) x = x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
  return [parseInt(x.slice(0,2),16), parseInt(x.slice(2,4),16), parseInt(x.slice(4,6),16)];
}
/* Luminancia relativa y ratio de contraste segun WCAG 2.1 */
function luminancia(rgb){
  var c = rgb.map(function(v){
    v = v/255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function contraste(a, b){
  var ra = hexToRgb(a), rb = hexToRgb(b);
  if(!ra || !rb) return null;
  var la = luminancia(ra), lb = luminancia(rb);
  var hi = Math.max(la,lb), lo = Math.min(la,lb);
  return (hi + 0.05) / (lo + 0.05);
}
function px(v){
  var m = /^(-?[\d.]+)px$/.exec(String(v||"").trim());
  return m ? parseFloat(m[1]) : null;
}
function avisosApariencia(o, res){
  var C = o.colors || {}, B = o.banner || {}, P = o.panel || {}, T = o.typography || {}, H = o.chip || {};
  var pares = [
    [B.background || C.ink,   B.color || C.text,          "texto del banner"],
    [P.background || C.panelBg, C.heading,                "titulos del panel"],
    [P.background || C.panelBg, C.body,                   "descripciones del panel"],
    [(o.buttons && o.buttons.accept && o.buttons.accept.background) || C.accent,
     (o.buttons && o.buttons.accept && o.buttons.accept.color) || C.textBright, "boton de aceptar"],
    [H.background || C.panelBg, H.color || C.body,        "pill de reapertura"]
  ];
  pares.forEach(function(par){
    var r = contraste(par[0], par[1]);
    if(r === null) return;                       // no son hex: no se puede medir
    if(r < 3)      res.push({s:"warn", t:"Contraste muy bajo en el <b>"+par[2]+"</b> ("+r.toFixed(1)+":1). Por debajo de 3:1 cuesta leerlo."});
    else if(r < 4.5) res.push({s:"warn", t:"Contraste justo en el <b>"+par[2]+"</b> ("+r.toFixed(1)+":1). WCAG pide 4.5:1 para texto normal."});
  });
  var bw = px(B.maxWidth), pw = px(P.maxWidth);
  if(bw !== null && bw < 280) res.push({s:"warn", t:"<b>Ancho del banner</b> de "+bw+"px: por debajo de 280px el contenido se desborda."});
  if(pw !== null && pw < 300) res.push({s:"warn", t:"<b>Ancho del panel</b> de "+pw+"px: los interruptores y sus textos no caben bien."});
  var ts = px(T.bannerText && T.bannerText.size), cs = px(T.catDesc && T.catDesc.size);
  if(ts !== null && ts < 12) res.push({s:"warn", t:"<b>Texto del banner</b> a "+ts+"px: por debajo de 12px es dificil de leer en movil."});
  if(cs !== null && cs < 11) res.push({s:"warn", t:"<b>Descripcion de categorias</b> a "+cs+"px: demasiado pequeno para un texto legal."});
  if(H.enabled === false) res.push({s:"warn", t:"<b>Pill desactivado</b>: sin el, el visitante no puede reabrir el panel para cambiar de opinion."});
  if((H.mode === "image" || H.mode === "both") && !H.image)
    res.push({s:"warn", t:"El pill esta en modo imagen pero <b>chip.image esta vacio</b>: se mostrara solo el texto."});
  if(H.mode === "image" && H.image && !H.imageAlt)
    res.push({s:"warn", t:"Pill con solo imagen y <b>sin texto alternativo</b>: un lector de pantalla no sabra que es."});
}

function saveCfg(){
  if(!validarCfg()){ msg("smsg","Corrige los errores antes de guardar.",true); return; }
  var cfg;
  try{ cfg = JSON.parse(el("cfg").value); }
  catch(e){ msg("smsg","JSON invalido.",true); return; }
  j("POST","/dash/site/save",{site_id:current,config:cfg}).then(function(r){
    if(r.ok){ msg("smsg","Guardado. Version "+r.d.version+".",false); openTab("config"); }
    else msg("smsg", r.d.error||"No se pudo guardar.", true);
  });
}

/* ---------------- INSTALAR ---------------- */
function buildSnippet(d){
  // El pre-bloqueador va INLINE y antes que nada: el bundle llega por red y
  // para entonces el parser del navegador ya habria lanzado las etiquetas.
  var rules = (d.config && d.config.autoBlock) || [];
  var cfgObj = '{siteId:"'+d.site_id+'",apiBase:"'+API+'"'+
    (rules.length ? ',autoBlock:'+JSON.stringify(rules) : '')+'}';
  var s = "<!-- Consent Banner. En el <head>, lo primero, una sola vez -->\n"+
    "<script>\nwindow.__consentConfig="+cfgObj+";\n";
  if(rules.length){
    s +=
'(function(){var C=window.__consentConfig||{},R=C.autoBlock||[];if(!R.length)return;\n'+
'var B={observer:null,blocked:[]};window.__consentBlocker=B;\n'+
'function H(s){try{return new URL(s,location.href).hostname.toLowerCase()}catch(e){return ""}}\n'+
'function hit(s){if(!s)return null;var h=H(s);if(!h||h===location.hostname.toLowerCase())return null;\n'+
'for(var i=0;i<R.length;i++){var r=R[i];if(!r||!r.match)continue;var m=String(r.match).toLowerCase().replace(/^\\*?\\.?/,"");\n'+
'if(h===m||h.slice(-(m.length+1))==="."+m)return r}return null}\n'+
'function kill(n,r){var s=n.getAttribute("src");n.type="text/plain";n.setAttribute("type","text/plain");\n'+
'n.setAttribute("data-consent-src",s);n.setAttribute("data-consent-category",r.category);n.removeAttribute("src");B.blocked.push(s)}\n'+
'B.observer=new MutationObserver(function(m){m.forEach(function(x){Array.prototype.forEach.call(x.addedNodes,function(n){\n'+
'if(n.tagName==="SCRIPT"){var r=hit(n.getAttribute("src"));if(r)kill(n,r)}})})});\n'+
'B.observer.observe(document.documentElement,{childList:true,subtree:true});})();\n';
  }
  s += '<\/script>\n<script async src="'+API+'/consent-banner.js"><\/script>';
  return s;
}

function viewInstalar(d){

  var rules = (d.config && d.config.autoBlock) || [];
  el("tabbody").innerHTML =

        '<h2>Codigo para el sitio</h2>'+
        '<p class="sub">Pegalo en el <code>&lt;head&gt;</code>, lo mas arriba posible y una sola vez.'+
        (rules.length ? ' Incluye el pre-bloqueador con <b>'+rules.length+' regla(s)</b>.' : '')+'</p>'+
        '<ol class="steps">'+
          '<li>Copia el bloque completo.</li>'+
          '<li>Pegalo en el <code>&lt;head&gt;</code>, antes de cualquier otro script.</li>'+
          '<li>Limpia la cache del sitio y recarga.</li>'+
        '</ol>'+
        '<div class="snippet" id="snip">'+esc(snippet)+'</div>'+
        '<div class="row mt">'+
          '<button class="btn" onclick="copiarSnippet()">Copiar codigo</button>'+
          '<span id="cmsg" class="msg"></span>'+
        '</div>'+
      '</div>'+
      '<div>'+
        '<div class="card">'+
          '<h2>Dominios autorizados</h2>'+
          '<p class="sub">Separados por coma. Solo desde estos dominios se aceptan registros.</p>'+
          '<input type="text" id="dom" value="'+esc(d.d && d.d.domain || "")+'" placeholder="cliente.com, www.cliente.com" />'+
          '<div class="row mt"><button class="btn ghost sm" onclick="guardarDominio()">Guardar dominios</button>'+
          '<span id="dmsg" class="msg"></span></div>'+
        '</div>'+
        '<div class="card">'+
          '<h2>Comprobar</h2>'+
          '<p class="sub">Abre el sitio de ejemplo para verificar que el banner responde con esta configuracion.</p>'+
          '<a class="btn ghost sm" target="_blank" href="'+API+'/sitio-demo.html?site_id='+encodeURIComponent(d.site_id)+'">Abrir sitio demo</a>'+
        '</div>'+
      '</div>'+
    '</div>';
}
function copiarSnippet(){
  var t = el("snip").textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ msg("cmsg","Copiado.",false); },
                                         function(){ msg("cmsg","No se pudo copiar.",true); });
  } else {
    var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); msg("cmsg","Copiado.",false); }
    catch(e){ msg("cmsg","No se pudo copiar.",true); }
    document.body.removeChild(ta);
  }
}
function guardarDominio(){
  j("POST","/dash/site/domain",{site_id:current,domain:val("dom")}).then(function(r){
    if(r.ok) msg("dmsg","Guardado.",false); else msg("dmsg", r.d.error||"error", true);
  });
}

function loadLogs(){

/* categories viaja como texto JSON desde la base */
function cats(raw){
  var vacio = '<span class="cat">sin datos</span>';
  if(!raw) return vacio;
  var o;
  try{ o = typeof raw==="string" ? JSON.parse(raw) : raw; }catch(e){ return vacio; }
  if(!o || typeof o!=="object") return vacio;
  var ks = Object.keys(o);
  if(!ks.length) return vacio;
  return '<div class="cats">'+ks.map(function(k){
    return '<span class="cat'+(o[k]?' on':'')+'">'+esc(k)+'</span>';
  }).join('')+'</div>';
}

/* ---------------- COOKIES DETECTADAS ---------------- */
/* El bundle reporta que NOMBRES de cookie aparecen en el sitio real (nunca su
   valor). Aqui se decide que es cada una. Solo las no esenciales acaban en
   cookiePatterns: una cookie de sesion o de seguridad no se debe borrar. */
var _ckCambios = {};     // nombre -> {category, status} pendiente de guardar

function viewCookies(d){
  var cats = (d.config && d.config.categories) || [];
  window._ckCats = cats.map(function(c){ return c.id; });
  el("tabbody").innerHTML =
    '<div class="card">'+
      '<div class="ck-head">'+
        '<div><h2 style="margin:0">Cookies detectadas en el sitio</h2>'+
        '<p class="sub" style="margin:4px 0 0">Clasifica cada una. Las esenciales nunca se borran.</p></div>'+
        '<div class="row">'+
          '<button class="btn ghost sm" onclick="aceptarSugerencias()">Aplicar sugerencias</button>'+
          '<button class="btn ghost sm" onclick="loadCookies()">Refrescar</button>'+
          '<button class="btn sm" id="ck-save" onclick="guardarCookies()">Guardar clasificacion</button>'+
        '</div>'+
      '</div>'+
      '<div id="ck-aviso"></div>'+
      '<div id="ck-body"><div class="empty">Cargando...</div></div>'+
      '<div class="row mt"><span id="ck-msg" class="msg"></span></div>'+
    '</div>';
  loadCookies();
}

function loadCookies(){
  _ckCambios = {};
  j("GET","/dash/site/cookies?site_id="+encodeURIComponent(current)).then(function(r){
    if(!r.ok){ el("ck-body").innerHTML = '<div class="empty">No se pudieron cargar.</div>'; return; }
    window._ckRows = r.d.rows || [];
    pintarCookies();
  });
}

function pintarCookies(){
  var rows = window._ckRows || [], cats = window._ckCats || [];
  el("ck-aviso").innerHTML = avisoDeteccion(rows.length);
  if(!rows.length){
    el("ck-body").innerHTML = '<div class="empty">Todavia no se ha detectado ninguna cookie.</div>';
    return;
  }
  var pend = rows.filter(function(x){ return x.status==="nueva"; }).length;

  // Tipos entre los que se elige SOLO cuando la cookie no es necesaria.
  // Son las categorias no bloqueadas de la config: si el sitio no tiene
  // "marketing", aqui no aparece.
  var tipos = cats.filter(function(c){ return c !== "esencial"; });

  el("ck-body").innerHTML =
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+rows.length+'</div><div class="l">Detectadas</div></div>'+
      '<div class="stat cus"><div class="n">'+pend+'</div><div class="l">Sin decidir</div></div>'+
      '<div class="stat acc"><div class="n">'+rows.filter(function(x){return x.category==="esencial";}).length+
        '</div><div class="l">Necesarias</div></div>'+
      '<div class="stat rej"><div class="n">'+rows.filter(function(x){
          return x.status==="asignada" && x.category && x.category!=="esencial"; }).length+
        '</div><div class="l">No necesarias</div></div>'+
    '</div>'+
    '<div class="table-wrap"><table class="ck-tbl"><thead><tr>'+
      '<th>Cookie</th><th>Que es</th><th>&iquest;Es necesaria?</th><th>Tipo</th><th>Vista</th>'+
    '</tr></thead><tbody>'+
    rows.map(function(x){ return filaCookie(x, tipos); }).join('')+
    '</tbody></table></div>';
}

/* Una fila: la pregunta es binaria (necesaria o no). El desplegable de tipo
   solo tiene sentido cuando la respuesta es "no", y por eso se oculta. */
function filaCookie(x, tipos){
  var id = cssId(x.name);
  var esNecesaria   = x.category === "esencial";
  var esNoNecesaria = x.status === "asignada" && x.category && x.category !== "esencial";
  var sinDecidir    = !esNecesaria && !esNoNecesaria;

  var sug = "";
  if (x.sugerida === "esencial")      sug = '<span class="sug">se sugiere: necesaria</span>';
  else if (x.sugerida)                sug = '<span class="sug">se sugiere: no necesaria ('+esc(x.sugerida)+')</span>';
  else                                sug = '<span class="sug none">desconocida</span>';

  var desc = x.explicacion || "No esta en el catalogo. Averigua quien la escribe antes de decidir.";

  var opciones = tipos.map(function(c){
    return '<option value="'+esc(c)+'"'+(x.category===c?" selected":"")+'>'+esc(c)+'</option>';
  }).join('');

  return '<tr'+(sinDecidir?' class="sin-decidir"':'')+'>'+
    '<td><div class="ck-name">'+esc(x.name)+'</div>'+sug+'</td>'+
    '<td><div class="ck-desc">'+esc(desc)+'</div></td>'+
    '<td>'+
      '<div class="si-no" id="sn_'+id+'">'+
        '<button type="button" class="'+(esNecesaria?"on si":"")+'" '+
          'onclick="ckNecesaria(\''+esc(x.name).replace(/'/g,"")+'\',true)">Si, necesaria</button>'+
        '<button type="button" class="'+(esNoNecesaria?"on no":"")+'" '+
          'onclick="ckNecesaria(\''+esc(x.name).replace(/'/g,"")+'\',false)">No</button>'+
      '</div>'+
    '</td>'+
    '<td>'+
      '<select class="ck-sel" id="tp_'+id+'" style="'+(esNoNecesaria?"":"display:none")+'" '+
        'onchange="ckTipo(\''+esc(x.name).replace(/'/g,"")+'\',this.value)">'+opciones+'</select>'+
      '<span class="nota-nec" id="nn_'+id+'" style="'+(esNecesaria?"":"display:none")+'">'+
        'Nunca se borra</span>'+
    '</td>'+
    '<td class="mono">'+esc(fecha(x.last_seen))+'<br><span style="font-size:10.5px">'+
      esc(x.hits)+' veces, '+esc(x.phase||"")+'</span></td>'+
  '</tr>';
}

function cssId(n){ return String(n).replace(/[^a-zA-Z0-9_]/g,"_"); }

/* Aviso segun el estado de la deteccion: si no esta activada, no llegaran datos. */
function avisoDeteccion(cuantas){
  var activa = window._cfgActual && window._cfgActual.cookieDiscovery === true;
  if(activa) return "";
  return '<div class="banner-info"><b>La deteccion esta apagada.</b> '+
    'Pon <code>"cookieDiscovery": true</code> en la configuracion para que el sitio '+
    'empiece a reportar que cookies aparecen. '+
    (cuantas ? 'Lo de abajo es lo que se detecto antes de apagarla.' : '')+'</div>';
}

/* Respuesta a "es necesaria?". Si es que NO, hay que decir de que tipo, y se
   toma el tipo sugerido por el catalogo o el primero disponible. */
function ckNecesaria(nombre, necesaria){
  var fila = (window._ckRows||[]).filter(function(r){ return r.name===nombre; })[0];
  if(!fila) return;
  var id = cssId(nombre);
  var tipos = (window._ckCats||[]).filter(function(c){ return c!=="esencial"; });

  if(necesaria){
    fila.category = "esencial"; fila.status = "asignada";
  } else {
    var elegido = fila.category && fila.category !== "esencial" ? fila.category : "";
    if(!elegido && fila.sugerida && fila.sugerida !== "esencial" && tipos.indexOf(fila.sugerida) > -1){
      elegido = fila.sugerida;                 // el catalogo ya sabe de que tipo es
    }
    if(!elegido) elegido = tipos[0] || "";
    fila.category = elegido;
    // Sin ningun tipo disponible no se puede clasificar como no necesaria.
    fila.status = elegido ? "asignada" : "nueva";
    if(!elegido){
      msg("ck-msg","Para marcar cookies como no necesarias, anade alguna categoria "+
                   "en la configuracion (aparte de las bloqueadas).", true);
      return;
    }
  }
  _ckCambios[nombre] = { category: fila.category, status: fila.status };

  // Pintar el cambio sin rehacer toda la tabla, para no perder el scroll.
  var grupo = el("sn_"+id);
  if(grupo){
    var bs = grupo.getElementsByTagName("button");
    bs[0].className = necesaria ? "on si" : "";
    bs[1].className = necesaria ? "" : "on no";
  }
  var sel = el("tp_"+id), nota = el("nn_"+id);
  if(sel){ sel.style.display = necesaria ? "none" : ""; if(!necesaria) sel.value = fila.category; }
  if(nota){ nota.style.display = necesaria ? "" : "none"; }
  var tr = grupo && grupo.parentNode ? grupo.parentNode.parentNode : null;
  if(tr) tr.className = "";
  contarCambios();
}

function ckTipo(nombre, valor){
  var fila = (window._ckRows||[]).filter(function(r){ return r.name===nombre; })[0];
  if(!fila) return;
  fila.category = valor; fila.status = "asignada";
  _ckCambios[nombre] = { category: valor, status: "asignada" };
  contarCambios();
}

function contarCambios(){
  var n = Object.keys(_ckCambios).length;
  msg("ck-msg", n ? n+" cambio(s) sin guardar. Pulsa Guardar." : "", false);
}

/* Responde por ti segun el catalogo: lo conocido como de sesion o seguridad
   queda como necesaria, lo demas como no necesaria con su tipo. Lo desconocido
   se queda sin decidir a proposito: eso lo tienes que mirar tu. */
function aceptarSugerencias(){
  var rows = window._ckRows || [];
  var tipos = (window._ckCats||[]).filter(function(c){ return c!=="esencial"; });
  var n = 0;
  rows.forEach(function(x){
    if(x.status === "asignada" || !x.sugerida) return;
    if(x.sugerida === "esencial"){
      x.category = "esencial"; x.status = "asignada";
    } else {
      if(tipos.indexOf(x.sugerida) < 0) return;   // ese tipo no existe en la config
      x.category = x.sugerida; x.status = "asignada";
    }
    _ckCambios[x.name] = { category: x.category, status: "asignada" };
    n++;
  });
  pintarCookies();
  msg("ck-msg", n ? (n+" cookie(s) respondidas. Revisa y pulsa Guardar.")
                  : "No hay sugerencias aplicables.", false);
}

function guardarCookies(){
  var items = Object.keys(_ckCambios).map(function(k){
    return { name:k, category:_ckCambios[k].category, status:_ckCambios[k].status };
  });
  if(!items.length){ msg("ck-msg","No hay cambios que guardar.", true); return; }
  j("POST","/dash/site/cookies/classify",{site_id:current, items:items}).then(function(r){
    if(!r.ok){ msg("ck-msg", r.d.error||"No se pudo guardar.", true); return; }
    // Volcar a cookiePatterns crea una version nueva de la config.
    j("POST","/dash/site/cookies/apply",{site_id:current}).then(function(r2){
      if(r2.ok){
        var n = (r2.d.anadidas||[]).length;
        msg("ck-msg", "Guardado. "+(n ? n+" patron(es) anadidos a la configuracion (version "+r2.d.version+")."
                                      : "Sin patrones nuevos que anadir."), false);
        loadCookies();
      } else msg("ck-msg", r2.d.error||"Guardado, pero no se pudo aplicar.", true);
    });
  });
}

    '<div class="cols">'+
      '<div class="card">'+
        '<h2>Cambiar contrasena</h2>'+

        '<div class="field"><label>Contrasena actual</label><input type="password" id="pw-actual" /></div>'+
        '<div class="field"><label>Contrasena nueva</label><input type="password" id="pw-nueva" placeholder="Minimo 8 caracteres" /></div>'+

        '<p class="hint" id="pw-msg"></p>'+
      '</div>'+

        '<h2>Sitios</h2>'+

            '<button class="btn danger sm" onclick="modalBorrarSitio(\''+s.site_id+'\',\''+safe+'\')">Borrar</button>'+

function cambiarPass(){
  j("POST","/dash/password",{actual:val("pw-actual"),nueva:val("pw-nueva")}).then(function(r){
    var m = el("pw-msg");
    if(r.ok){
      m.textContent = "Contrasena actualizada. Las demas sesiones se cerraron.";

      el("pw-actual").value=""; el("pw-nueva").value="";
    } else {
      m.textContent = (r.d && r.d.error) ? r.d.error : "No se pudo cambiar.";
      m.className = "hint err";
    }
  });
}

/* ---------------- modales ---------------- */
function cerrarModal(){ el("modal-host").innerHTML = ""; }
function modalNuevoSitio(){
  menuOpen = false; renderPicker();
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Nuevo sitio</h3><p class="sub">Puedes cambiar los dominios mas tarde.</p>'+
      '<div class="field"><label>Nombre</label><input id="n-name" type="text" placeholder="Tienda del cliente" maxlength="80" /></div>'+
      '<div class="field"><label>Dominios (separados por coma)</label><input id="n-dom" type="text" placeholder="cliente.com, pruebas.cliente.com" /></div>'+
      '<div class="row mt"><button class="btn" onclick="createSite()">Crear sitio</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
      '<p class="hint" id="n-msg"></p>'+
    '</div></div>';
  setTimeout(function(){ var e=el("n-name"); if(e) e.focus(); }, 30);
}
function createSite(){
  var name = val("n-name").trim();
  if(!name){ msg("n-msg","Pon un nombre para identificarlo.",true); return; }
  j("POST","/dash/site/create",{name:name,domain:val("n-dom")}).then(function(r){
    if(r.ok){ current = r.d.site_id; cerrarModal(); tab = "instalar"; boot(); }
    else msg("n-msg", r.d.error||"No se pudo crear.", true);
  });
}
function modalBorrarSitio(id, name){
  menuOpen = false; renderPicker();
  el("modal-host").innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+
      '<h3>Borrar "'+esc(name)+'"</h3>'+
      '<p class="sub">Se eliminan tambien su configuracion y todos sus registros de consentimiento. '+
      'Esta accion no se puede deshacer.</p>'+
      '<div class="row mt"><button class="btn danger" onclick="deleteSite(\''+id+'\')">Si, borrar</button>'+
      '<button class="btn ghost" onclick="cerrarModal()">Cancelar</button></div>'+
      '<p class="hint" id="del-msg"></p>'+
    '</div></div>';
}
function deleteSite(id){
  j("POST","/dash/site/delete",{site_id:id}).then(function(r){
    if(r.ok){
      cerrarModal();
      if(current===id) current = null;
      boot();
    } else msg("del-msg", r.d.error||"No se pudo borrar.", true);
  });
}

boot();
