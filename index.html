  --paper-0:#FFFFFF;--paper-25:#FAF8F4;--paper-50:#F4F1EA;--paper-100:#E9E5DB;--paper-200:#D6D0C3;--paper-400:#8E877A;--paper-500:#7D766A;--paper-600:#57524A;--paper-800:#2E2B26;--paper-900:#1A1916;

  /* --- semantic: brand --- */
  --color-primary:var(--spruce-800);
  --color-primary-hover:var(--spruce-700);
  --color-primary-press:var(--spruce-900);
  --color-on-primary:#FFFFFF;
  --color-primary-subtle:var(--spruce-50);
  --color-on-primary-subtle:var(--spruce-800);
  --color-primary-tint:var(--spruce-100);
  --color-secondary:var(--spruce-600);
  --color-accent:var(--brass-600);          /* sparing: marketing highlights, active tab ticks */
  --color-accent-subtle:var(--brass-100);
  --color-on-accent:#FFFFFF;
  --color-highlight:var(--spruce-300);      /* accent ON dark surfaces */

  /* --- semantic: surfaces --- */
  --surface-page:var(--paper-25);
  --surface-card:var(--paper-0);
  --surface-sunken:var(--paper-50);
  --surface-hover:var(--paper-50);
  --surface-inverse:var(--spruce-900);
  --surface-inverse-raised:var(--spruce-800);
  --surface-overlay:rgba(11,46,40,.48);

  /* --- semantic: text --- */
  --text-strong:var(--paper-900);
  --text-body:var(--paper-800);
  --text-muted:var(--paper-600);
  --text-subtle:var(--paper-500);           /* 4.5:1 on white only, use for meta, never on sunken */
  --text-inverse:var(--paper-50);
  --text-inverse-muted:var(--spruce-300);
  --text-link:var(--spruce-600);
  --text-link-hover:var(--spruce-800);

  /* --- semantic: borders & focus --- */
  --border-subtle:var(--paper-100);
  --border-default:var(--paper-200);
  --border-strong:var(--paper-400);         /* 3:1 on white, form controls */
  --focus-ring:var(--spruce-600);
  --focus-ring-inverse:var(--spruce-300);

  /* --- semantic: status (fg on bg ≥ 4.5:1) --- */
  --success-fg:#1E6B45;--success-bg:#E3F2E9;--success-solid:#1E6B45;
  --warning-fg:#8A5A00;--warning-bg:#FBF0D9;--warning-solid:#B07A12;
  --error-fg:#A8281E;--error-bg:#FBEAE8;--error-solid:#A8281E;
  --info-fg:#1F5B94;--info-bg:#E6EFF8;--info-solid:#1F5B94;

  /* --- consent banner theming hooks (clients override these 4) --- */
  --consent-accent:var(--color-primary);
  --consent-on-accent:var(--color-on-primary);
  --consent-surface:var(--surface-card);
  --consent-text:var(--text-body);
}

/* Type tokens. 1.250 major-third scale on a 16px base. */
:root{
  --font-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;

  --text-xs:12px;--text-sm:14px;--text-md:16px;--text-lg:18px;--text-xl:20px;
  --text-2xl:25px;--text-3xl:31px;--text-4xl:39px;--text-5xl:49px;--text-6xl:61px;--text-7xl:76px;

  --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
  --weight-display:700;
  --tracking-display:-0.025em;--tracking-heading:-0.015em;--tracking-body:0;--tracking-caps:0.08em;
  --leading-tight:1.08;--leading-snug:1.25;--leading-body:1.55;

  /* semantic */
  --type-display:var(--weight-display) var(--text-6xl)/var(--leading-tight) var(--font-display);
  --type-h1:var(--weight-display) var(--text-5xl)/var(--leading-tight) var(--font-display);
  --type-h2:var(--weight-display) var(--text-3xl)/var(--leading-snug) var(--font-display);
  --type-h3:var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-display);
  --type-body:var(--weight-regular) var(--text-md)/var(--leading-body) var(--font-body);
  --type-small:var(--weight-regular) var(--text-sm)/1.5 var(--font-body);
  --type-label:var(--weight-semibold) var(--text-sm)/1.3 var(--font-body);
  --type-eyebrow:var(--weight-semibold) var(--text-xs)/1.3 var(--font-body);
  --type-mono:var(--weight-regular) var(--text-sm)/1.5 var(--font-mono);
  --eyebrow-transform:uppercase; /* @kind other */
}

/* 4px base spacing scale. */
:root{
  --space-0:0;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;--space-24:96px;
  --control-sm:32px;--control-md:40px;--control-lg:48px;   /* ≥ 24px target (WCAG 2.5.8); lg used on mobile banner */
  --container-max:1200px;--gutter:24px;
}

/* Radii, borders, elevation, motion. */
:root{
  --radius-xs:4px;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;
  --border-width:1px;--focus-width:2px;--focus-offset:2px;
  --shadow-1:0 1px 2px rgba(26,25,22,.06),0 1px 1px rgba(26,25,22,.04);
  --shadow-2:0 4px 12px rgba(26,25,22,.08),0 1px 3px rgba(26,25,22,.06);
  --shadow-3:0 16px 40px rgba(11,46,40,.16),0 4px 12px rgba(11,46,40,.08);
  --ease-standard:cubic-bezier(.2,0,0,1); /* @kind other */
  --ease-exit:cubic-bezier(.4,0,1,1); /* @kind other */
  --duration-fast:120ms; /* @kind other */
  --duration-base:200ms; /* @kind other */
  --duration-slow:320ms; /* @kind other */
}

/* Minimal element defaults so cards & kits pick up the active direction. */
html{color-scheme:light}
body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);-webkit-font-smoothing:antialiased}
a{color:var(--text-link);text-underline-offset:3px}
a:hover{color:var(--text-link-hover)}
:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}


*{box-sizing:border-box}body{margin:0}
